plugins {
    id "com.android.application"
}

android {
    namespace "ca.damasio.employee"
    compileSdk 35

    defaultConfig {
        applicationId "ca.damasio.employee.test"
        minSdk 24
        targetSdk 35
        versionCode 23
        versionName "52.3.1-test"
    }

    // Public TEST signing only for ca.damasio.employee.test. This keeps direct
    // QA APK updates installable over future test builds. Production releases
    // use Google Play App Signing and must not reuse this key.
    signingConfigs {
        qaStable {
            storeFile file("../test-signing.keystore")
            storePassword "4everseasons-test"
            keyAlias "4ever-test"
            keyPassword "4everseasons-test"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.qaStable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// AndroidX Biometric 1.1.0 still references the split Kotlin JDK7/JDK8
// artifacts. Align them with the stdlib version already selected by modern
// AndroidX Core so Gradle does not package duplicate Kotlin classes.
configurations.configureEach {
    resolutionStrategy.force(
        "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    )
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.biometric:biometric:1.1.0"
}
