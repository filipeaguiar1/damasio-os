name: QA fix Stripe E2E cleanup

on:
  push:
    branches:
      - qa/full-ecosystem-e2e-20260807
    paths:
      - .github/workflows/qa-fix-stripe-e2e-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/full-ecosystem-stripe.spec.ts')
          text = path.read_text()
          old = '    await service.from("customer_tips").delete().eq("customer_id", customerId).catch(() => undefined);'
          new = '    try { await service.from("customer_tips").delete().eq("customer_id", customerId); } catch { /* best-effort QA cleanup */ }'
          if old not in text:
              raise SystemExit('Stripe cleanup anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm typecheck
      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/qa-fix-stripe-e2e-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/full-ecosystem-stripe.spec.ts .github/workflows/qa-fix-stripe-e2e-cleanup.yml
          git commit -m "Fix Stripe E2E cleanup query"
          git push origin HEAD:qa/full-ecosystem-e2e-20260807
