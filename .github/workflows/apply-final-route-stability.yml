name: Apply Final Route Stability

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-final-route-stability.py"
      - ".github/workflows/apply-final-route-stability.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/25-30-homes-simulator-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply final stability patch
        run: python scripts/apply-final-route-stability.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated functional changes
        run: |
          git config user.name "Damasio OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/admin/routes/route.ts tests/operational-simulator.spec.ts tests/canonical-route-sync.spec.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(routes): stabilize active canonical route validation"
          git push origin HEAD:feature/25-30-homes-simulator-v1
