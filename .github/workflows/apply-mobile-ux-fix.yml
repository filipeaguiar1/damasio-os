name: Apply Mobile UX Fix

on:
  push:
    branches:
      - fix/mobile-alerts-tasks-smart-route
    paths:
      - scripts/apply-mobile-ux-fix.py
      - .github/workflows/apply-mobile-ux-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-alerts-tasks-smart-route
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply-mobile-ux-fix.py
      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-mobile-ux-fix.py
          rm .github/workflows/apply-mobile-ux-fix.yml
      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile alerts tasks settings and Smart Route"
          git push origin HEAD:fix/mobile-alerts-tasks-smart-route
