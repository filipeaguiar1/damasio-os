name: Apply E2E runtime diagnostics fix

on:
  push:
    branches:
      - agent/overnight-e2e-qa

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/overnight-e2e-qa
      - name: Make runtime failure evidence actionable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/surfaces.spec.cjs')
          text = path.read_text()
          old = '''function collectRuntimeFailures(page) {
  const failures = [];
  page.on('pageerror', error => failures.push(`pageerror: ${error.message}`));
  page.on('console', message => {
    if (message.type() === 'error') failures.push(`console: ${message.text()}`);
  });
  page.on('requestfailed', request => {
    const errorText = request.failure()?.errorText || '';
    const url = request.url();
    const isExpectedNextNavigationAbort = errorText.includes('ERR_ABORTED') && url.includes('_rsc=');
    if (!isExpectedNextNavigationAbort) failures.push(`request: ${request.method()} ${url} ${errorText}`);
  });
  return failures;
}
'''
          new = '''function collectRuntimeFailures(page) {
  const failures = [];
  page.on('pageerror', error => failures.push(`pageerror: ${error.message}`));
  page.on('console', message => {
    if (message.type() !== 'error') return;
    const text = message.text();
    if (/^Failed to load resource: the server responded with a status of 4\\d\\d/i.test(text)) return;
    failures.push(`console: ${text}`);
  });
  page.on('response', response => {
    if (response.status() >= 400) failures.push(`response: ${response.status()} ${response.request().method()} ${response.url()}`);
  });
  page.on('requestfailed', request => {
    const errorText = request.failure()?.errorText || '';
    if (errorText.includes('ERR_ABORTED')) return;
    failures.push(`request: ${request.method()} ${request.url()} ${errorText}`);
  });
  return failures;
}
'''
          if old not in text:
              raise SystemExit('runtime failure collector block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/surfaces.spec.cjs
          git commit -m "test: report actionable browser failures"
          git push origin HEAD:agent/overnight-e2e-qa

# Triggered once for the dedicated repair branch.
