name: Apply Canonical Route Final Fix

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - .github/workflows/apply-canonical-route-final-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - name: Apply canonical route repair
        run: |
          cat .routefix/part*.b64 | base64 --decode > /tmp/apply-canonical-route-final-fix.py
          python /tmp/apply-canonical-route-final-fix.py
          rm -rf .routefix
          rm -f .github/workflows/apply-canonical-route-final-fix.yml

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate static route contracts
        run: |
          node scripts/validate-canonical-route.mjs
          node scripts/validate-canonical-map-sync.mjs
          pnpm exec tsc --noEmit

      - name: Build production application
        run: pnpm build

      - name: Publish repaired branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(routes): finish canonical cross-device synchronization"
          git push origin HEAD:feature/25-30-homes-simulator-v1
