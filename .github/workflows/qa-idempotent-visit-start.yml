name: Idempotent Visit Start Hotfix

on:
  push:
    branches:
      - fix/idempotent-visit-start-20260808

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/idempotent-visit-start-20260808
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply hotfix
        run: python scripts/qa-idempotent-visit-start.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Persist validated hotfix
        shell: bash
        run: |
          git config user.name "Damasio QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/mobile/employee/route/route.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Idempotent Visit start hotfix already applied."
            exit 0
          fi
          git commit -m "Fix idempotent Employee Visit start"
          git push origin HEAD:fix/idempotent-visit-start-20260808
