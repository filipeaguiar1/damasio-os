name: QA Apply Final Employee Sync Fix

on:
  push:
    branches: [qa/full-ecosystem-e2e-20260807]
    paths:
      - .github/workflows/qa-apply-final-sync-email-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Keep QA identities non-transactional, but use a syntactically accepted reserved domain.
          p = Path('tests/full-ecosystem.spec.ts')
          s = p.read_text()
          s = s.replace('@4everseasons.test', '@example.com')
          p.write_text(s)

          # 2) Employee route resolver must use the same uncached service reads as the strong snapshot.
          p = Path('app/api/employee/canonical-route/route.ts')
          s = p.read_text()
          old = '''function serviceClient() {\n  const url = process.env.NEXT_PUBLIC_SUPABASE_URL;\n  const key = process.env.SUPABASE_SERVICE_ROLE_KEY;\n  if (!url || !key) throw new Error("Employee canonical route resolver is not configured.");\n  return createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } }) as any;\n}'''
          new = '''const uncachedFetch: typeof fetch = (input, init) => fetch(input, {\n  ...init,\n  cache: "no-store",\n});\n\nfunction serviceClient() {\n  const url = process.env.NEXT_PUBLIC_SUPABASE_URL;\n  const key = process.env.SUPABASE_SERVICE_ROLE_KEY;\n  if (!url || !key) throw new Error("Employee canonical route resolver is not configured.");\n  return createClient(url, key, {\n    auth: { persistSession: false, autoRefreshToken: false },\n    global: { fetch: uncachedFetch },\n  }) as any;\n}'''
          if old not in s:
              raise SystemExit('employee resolver serviceClient anchor not found')
          p.write_text(s.replace(old, new))

          # 3) The map already receives a strongly-loaded EmployeeRouteMapContext. Surface that
          # canonical version while the hook independently revalidates the same route.
          p = Path('components/mobile/EmployeeRouteMap.tsx')
          s = p.read_text()
          s = s.replace('''  routeId?: string;\n  desktop?: boolean;''', '''  routeId?: string;\n  routeVersion?: number | null;\n  desktop?: boolean;''')
          s = s.replace('''  routeId,\n  desktop = false,''', '''  routeId,\n  routeVersion = null,\n  desktop = false,''')
          anchor = '''  const mapStatus = preview\n    ? "Smart Route preview · not published"\n    : snapshotMatches\n      ? `Canonical route v${snapshot?.routeVersion}`\n      : points.length === displayRoute.length && displayRoute.length > 0'''
          replacement = '''  const visibleCanonicalVersion = Math.max(\n    snapshotMatches ? Number(snapshot?.routeVersion || 0) : 0,\n    effectiveRouteId ? Number(routeVersion || 0) : 0,\n  );\n  const mapStatus = preview\n    ? "Smart Route preview · not published"\n    : visibleCanonicalVersion > 0\n      ? `Canonical route v${visibleCanonicalVersion}`\n      : points.length === displayRoute.length && displayRoute.length > 0'''
          if anchor not in s:
              raise SystemExit('EmployeeRouteMap status anchor not found')
          p.write_text(s.replace(anchor, replacement))

          # 4) Pass the version that came from the exact canonical context loaded by routeId.
          p = Path('app/mobile/employee/page.tsx')
          s = p.read_text()
          old = '''<EmployeeRouteMap route={mapRoute} routeId={mapContext.routeId||undefined} originPoint='''
          new = '''<EmployeeRouteMap route={mapRoute} routeId={mapContext.routeId||undefined} routeVersion={mapContext.routeVersion} originPoint='''
          if old not in s:
              raise SystemExit('mobile EmployeeRouteMap anchor not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Validate patch
        run: pnpm typecheck && pnpm test:route-writers && pnpm test:map-sync && node scripts/validate-qa-email-safety.mjs
      - name: Commit patch and self-remove
        run: |
          rm .github/workflows/qa-apply-final-sync-email-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: converge employee route version and safe QA identities'
          git push origin HEAD:qa/full-ecosystem-e2e-20260807
