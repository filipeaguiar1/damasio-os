name: Advanced Simulation Route Cleanup Fix

on:
  push:
    branches:
      - feature/advanced-simulation-foundation-20260808
    paths:
      - .github/workflows/advanced-simulation-route-cleanup-fix.yml

permissions:
  contents: write

concurrency:
  group: damasio-advanced-simulation-route-cleanup-fix
  cancel-in-progress: false

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/advanced-simulation-foundation-20260808
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply cleanup fix
        run: python scripts/fix-advanced-simulation-route-cleanup.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: |
          pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Validate production build
        run: pnpm build

      - name: Start production server
        run: |
          pnpm start > /tmp/damasio-advanced-route-cleanup.log 2>&1 &
          echo $! > /tmp/damasio-advanced-route-cleanup.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/damasio-advanced-route-cleanup.log
          exit 1

      - name: Run namespace isolation and reset gate
        run: pnpm exec playwright test tests/advanced-operational-simulator.spec.ts --reporter=line --workers=1

      - name: Run Customer-to-History gate
        run: pnpm exec playwright test tests/advanced-operational-simulator-journey.spec.ts --reporter=line --workers=1

      - name: Run 4,620-service zero-residue gate
        run: pnpm exec playwright test tests/advanced-operational-simulator-large.spec.ts --reporter=line --workers=1

      - name: Commit validated fix
        run: |
          rm scripts/fix-advanced-simulation-route-cleanup.py
          rm .github/workflows/advanced-simulation-route-cleanup-fix.yml
          git diff --check
          git config user.name "Damasio Simulation QA"
          git config user.email "actions@users.noreply.github.com"
          git add lib/simulator/advancedSimulationData.ts app/api/admin/operational-simulator/v2/route.ts tests/advanced-operational-simulator-large.spec.ts scripts/fix-advanced-simulation-route-cleanup.py .github/workflows/advanced-simulation-route-cleanup-fix.yml
          git commit -m "Fix advanced simulation Route cleanup"
          git push origin HEAD:feature/advanced-simulation-foundation-20260808

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-simulation-route-cleanup-fix
          path: /tmp/damasio-advanced-route-cleanup.log
          if-no-files-found: ignore
