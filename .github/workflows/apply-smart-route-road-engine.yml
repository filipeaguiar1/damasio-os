name: Apply Smart Route Road Engine

on:
  push:
    branches: [fix/employee-smart-route-road-engine]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/employee-smart-route-road-engine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply patch
        run: python scripts/apply-smart-route-road-engine.py
      - name: Remove one-time files
        run: rm scripts/apply-smart-route-road-engine.py .github/workflows/apply-smart-route-road-engine.yml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          node scripts/validate-canonical-route.mjs
          node scripts/simulate-canonical-operations.mjs
          pnpm typecheck
          pnpm build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use road-network engine for Employee Smart Route"
          git push origin HEAD:fix/employee-smart-route-road-engine
