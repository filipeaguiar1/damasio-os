name: Focused Admin polish
on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - ".github/workflows/agent-admin-polish-run.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/admin-polish.py
          python /tmp/admin-polish.py
      - name: Verify real file changes
        run: |
          test -n "$(git status --short -- components/admin/AdminShell.tsx app/admin/customers/[id]/page.tsx app/admin/customers/page.tsx app/globals.css)"
          grep -q 'loadSchedulingDispatchBoard(),' 'app/admin/customers/[id]/page.tsx'
          grep -q 'V52.8 focused Admin polish' app/globals.css
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          pnpm check
          pnpm build
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/agent-admin-polish-run.yml .github/workflows/agent-admin-polish-performance.yml
          git add -A
          git commit -m "Polish Admin UI and speed up property profiles"
          git push origin HEAD:feature/25-30-homes-simulator-v1