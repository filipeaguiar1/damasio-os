name: Apply Canonical Advisor Editor

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - "scripts/apply-advisor-canonical-editor.py"
      - ".github/workflows/apply-advisor-canonical-editor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply canonical Advisor patch
        run: python scripts/apply-advisor-canonical-editor.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate implementation
        run: pnpm build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/hooks/useCanonicalRouteSnapshot.ts \
            lib/services/routeMapService.ts \
            app/employee/route/page.tsx \
            components/admin/RouteAdvisorPanel.tsx \
            components/admin/OfficialRoutePlanMap.tsx \
            components/admin/RouteStudio.tsx \
            app/api/admin/route-advisor/route.ts \
            tests/canonical-route-sync.spec.ts
          git commit -m "feat(routes): make Advisor edit the global canonical route"
          git push origin HEAD:feature/25-30-homes-simulator-v1
