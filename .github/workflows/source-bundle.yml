name: Source Bundle Audit

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: damasio-source-bundle
          path: |
            .
            !node_modules
            !.next
            !test-results
            !playwright-report
          include-hidden-files: true
          retention-days: 1
      - uses: actions/github-script@v7
        with:
          script: |
            await new Promise(resolve => setTimeout(resolve, 3000));
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const artifact = response.data.artifacts.find(item => item.name === 'damasio-source-bundle');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 40,
              body: `SOURCE_BUNDLE_RUN=${context.runId} ARTIFACT_ID=${artifact?.id || 'pending'}`,
            });
