name: QA fix mobile Smart Route refresh race

on:
  push:
    branches:
      - qa/full-ecosystem-e2e-20260807
    paths:
      - .github/workflows/qa-fix-mobile-smart-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch mobile refresh race
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/mobile/employee/page.tsx')
          t = p.read_text()
          old = '  function refresh(){\n'
          new = '  function refresh(reloadRoute=true){\n'
          if old not in t: raise SystemExit('refresh signature anchor not found')
          t = t.replace(old, new, 1)
          old = '      setRouteReload(value=>value+1);\n'
          new = '      if(reloadRoute)setRouteReload(value=>value+1);\n'
          if old not in t: raise SystemExit('route reload anchor not found')
          t = t.replace(old, new, 1)
          old = '      setSmartPreview([]);setHomeMode("route");setRouteView("map");refresh();setMessage("Smart Route applied. Admin and Employee now share the same published order.");'
          new = '      setSmartPreview([]);setHomeMode("route");setRouteView("map");refresh(false);setMessage("Smart Route applied. Admin and Employee now share the same published order.");'
          if old not in t: raise SystemExit('smart apply refresh anchor not found')
          t = t.replace(old, new, 1)
          old = '        refresh();setMessage("Original route restored on Admin and Employee.")'
          new = '        refresh(false);setMessage("Original route restored on Admin and Employee.")'
          if old not in t: raise SystemExit('smart restore refresh anchor not found')
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm typecheck && pnpm test:route-writers && pnpm test:map-sync
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/qa-fix-mobile-smart-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mobile/employee/page.tsx .github/workflows/qa-fix-mobile-smart-refresh.yml
          git commit -m "Fix mobile Smart Route refresh race"
          git push origin HEAD:qa/full-ecosystem-e2e-20260807
