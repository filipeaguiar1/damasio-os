name: Diagnose E2E Visit execution state

on:
  push:
    branches:
      - agent/overnight-e2e-qa

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TZ: America/Toronto
      E2E_EMPLOYEE_EMAIL: ${{ secrets.E2E_EMPLOYEE_EMAIL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Read dedicated Employee Visit state
        shell: bash
        run: |
          node <<'NODE'
          const base = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const email = process.env.E2E_EMPLOYEE_EMAIL;
          if (!base || !key || !email) throw new Error('Dedicated E2E diagnostics are not configured.');
          const headers = { apikey: key, authorization: `Bearer ${key}` };
          const employeeResponse = await fetch(`${base}/rest/v1/employees?email=eq.${encodeURIComponent(email)}&active=eq.true&select=id&limit=1`, { headers });
          const employees = await employeeResponse.json();
          if (!employeeResponse.ok || !employees[0]) throw new Error('Dedicated E2E Employee was not found.');
          const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
          const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
          const today = `${values.year}-${values.month}-${values.day}`;
          const visitResponse = await fetch(`${base}/rest/v1/visits?assigned_employee_id=eq.${employees[0].id}&scheduled_date=eq.${today}&select=id,status,started_at,finished_at,duration_seconds,created_at&order=created_at.desc&limit=8`, { headers });
          const visits = await visitResponse.json();
          if (!visitResponse.ok) throw new Error(visits.message || 'Dedicated E2E Visits could not be read.');
          console.log(JSON.stringify(visits, null, 2));
          NODE
