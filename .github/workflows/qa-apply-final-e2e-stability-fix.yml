name: QA Apply Final E2E Stability Fix

on:
  push:
    branches:
      - qa/full-ecosystem-e2e-20260807
    paths:
      - scripts/apply-final-e2e-stability-fix.py
      - .github/workflows/qa-apply-final-e2e-stability-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/apply-final-e2e-stability-fix.py
      - run: pnpm typecheck && pnpm test:route-writers && pnpm test:map-sync
      - name: Commit patch and remove temporary patch files
        run: |
          rm scripts/apply-final-e2e-stability-fix.py .github/workflows/qa-apply-final-e2e-stability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/full-ecosystem.spec.ts tests/operational-simulator.spec.ts tests/canonical-route-sync.spec.ts scripts/apply-final-e2e-stability-fix.py .github/workflows/qa-apply-final-e2e-stability-fix.yml
          git commit -m "test: stabilize long ecosystem and four-screen convergence"
          git push origin HEAD:qa/full-ecosystem-e2e-20260807
