name: Apply verified Employee sync repair

on:
  push:
    branches:
      - agent/overnight-e2e-qa

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/overnight-e2e-qa
      - name: Apply canonical Visit refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/mobile/employee/page.tsx")
          text = path.read_text()
          marker = "  useMobileRealtime(refresh);"
          helper = "  async function refreshAfterCanonicalVisitMutation(reloadCanonical:boolean){\n    if(reloadCanonical)setMapContext(await loadEmployeeRouteMapContext(selectedDate,crew));\n    refresh();\n  }\n\n"

          if "refreshAfterCanonicalVisitMutation" not in text:
              if marker not in text:
                  raise SystemExit("realtime marker not found")
              text = text.replace(marker, helper + marker, 1)

          replacements = [
              ('    try{if(selected.canonicalVisitId){const result=await runVisitStatusOrQueue(selected.canonicalVisitId,"in_progress");setOfflinePending(getOfflineActionCount());setMessage(result.queued?"Service start saved offline. It will sync automatically.":"Service started and synchronized.")}else{startServiceSession(selected.id,profile.name,crew);setMessage("Service started and synchronized.")} setRouteReload(value=>value+1); refresh();}', '    try{let reloadCanonical=false;if(selected.canonicalVisitId){const result=await runVisitStatusOrQueue(selected.canonicalVisitId,"in_progress");setOfflinePending(getOfflineActionCount());reloadCanonical=!result.queued;setMessage(result.queued?"Service start saved offline. It will sync automatically.":"Service started and synchronized.")}else{startServiceSession(selected.id,profile.name,crew);setMessage("Service started and synchronized.")} await refreshAfterCanonicalVisitMutation(reloadCanonical);}'),
              ('    try{if(selected.canonicalVisitId){const result=await runVisitStatusOrQueue(selected.canonicalVisitId,"completed");setOfflinePending(getOfflineActionCount());setMessage(result.queued?"Completion saved offline. It will sync automatically.":"Done. Every device was updated.")}else{finishServiceSession(selected.id,comment);setMessage("Done. Every device was updated.")} setRouteReload(value=>value+1); refresh();}', '    try{let reloadCanonical=false;if(selected.canonicalVisitId){const result=await runVisitStatusOrQueue(selected.canonicalVisitId,"completed");setOfflinePending(getOfflineActionCount());reloadCanonical=!result.queued;setMessage(result.queued?"Completion saved offline. It will sync automatically.":"Done. Every device was updated.")}else{finishServiceSession(selected.id,comment);setMessage("Done. Every device was updated.")} await refreshAfterCanonicalVisitMutation(reloadCanonical);}'),
              ('    try{if(selected.canonicalVisitId){const result=await runVisitStatusOrQueue(selected.canonicalVisitId,"scheduled");setOfflinePending(getOfflineActionCount());setMessage(result.queued?"Reset saved offline. It will sync automatically.":"House reset to Open on every device.")}else{resetServiceSession(selected.id);setMessage("House reset to Open on every device.")} setComment(""); setRouteReload(value=>value+1); refresh();}', '    try{let reloadCanonical=false;if(selected.canonicalVisitId){const result=await runVisitStatusOrQueue(selected.canonicalVisitId,"scheduled");setOfflinePending(getOfflineActionCount());reloadCanonical=!result.queued;setMessage(result.queued?"Reset saved offline. It will sync automatically.":"House reset to Open on every device.")}else{resetServiceSession(selected.id);setMessage("House reset to Open on every device.")} setComment(""); await refreshAfterCanonicalVisitMutation(reloadCanonical);}'),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit("mutation block not found")

          path.write_text(text)
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mobile/employee/page.tsx
          git commit -m "fix: refresh canonical visit after employee actions"
          git push origin HEAD:agent/overnight-e2e-qa
