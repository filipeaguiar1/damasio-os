name: QA harness stability

on:
  push:
    branches:
      - qa/full-ecosystem-e2e-20260807
    paths:
      - .github/workflows/agent-qa-harness-stability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Patch QA timing only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sim_path = Path('tests/operational-simulator.spec.ts')
          sim = sim_path.read_text()
          old = 'await expect(liveExceptions).toBeVisible();'
          if old not in sim:
            raise SystemExit('final Live Exception visibility assertion not found')
          sim = sim.replace(old, 'await expect(liveExceptions).toBeVisible({ timeout: 30_000 });', 1)
          sim_path.write_text(sim)

          route_path = Path('tests/canonical-route-sync.spec.ts')
          route = route_path.read_text()

          removal_pattern = re.compile(r'(const removal = await authRequest<any>\(adminDesktop, "/api/admin/operational-simulator", \{\s*method: "POST",\s*body: \{ action: "remove" \},)(\s*\}\);)')
          route, count = removal_pattern.subn(r'\1\n      timeoutMs: 120_000,\2', route, count=1)
          if count != 1:
            raise SystemExit('simulator removal request anchor not found')

          create_pattern = re.compile(r'(simulation = await authRequest<any>\(adminDesktop, "/api/admin/operational-simulator", \{\s*method: "POST",\s*body: \{ action: "create" \},)(\s*\}\);)')
          route, count = create_pattern.subn(r'\1\n        timeoutMs: 180_000,\2', route, count=1)
          if count != 1:
            raise SystemExit('simulator create request anchor not found')

          route_path.write_text(route)
          PY

      - name: Validate tests compile
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck

      - name: Commit verified harness fix
        shell: bash
        run: |
          rm .github/workflows/agent-qa-harness-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/operational-simulator.spec.ts tests/canonical-route-sync.spec.ts .github/workflows/agent-qa-harness-stability.yml
          git commit -m "Stabilize simulator and route sync QA timing"
          git pull --rebase origin qa/full-ecosystem-e2e-20260807
          git push origin HEAD:qa/full-ecosystem-e2e-20260807
