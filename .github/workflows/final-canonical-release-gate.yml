name: Final Canonical Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/final-canonical-release-gate.yml"

permissions:
  contents: read

concurrency:
  group: final-canonical-release-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  release-gate:
    if: github.event.pull_request.head.ref == 'feature/25-30-homes-simulator-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: |
          pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium
      - name: TypeScript and production build
        run: pnpm build
      - name: Start production server
        run: |
          pnpm start > /tmp/damasio-final-release.log 2>&1 &
          echo $! > /tmp/damasio-final-release.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/damasio-final-release.log
          exit 1
      - name: Full operational flow
        run: pnpm exec playwright test tests/operational-simulator.spec.ts --reporter=line --workers=1
      - name: Four-screen canonical Route
        run: pnpm exec playwright test tests/canonical-route-sync.spec.ts --reporter=line --workers=1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-canonical-release-evidence
          if-no-files-found: ignore
          path: |
            operational-simulator.png
            employee-live-route.png
            customer-feedback-result.png
            canonical-admin-web.png
            canonical-admin-mobile.png
            canonical-employee-web.png
            canonical-employee-mobile.png
            /tmp/damasio-final-release.log
