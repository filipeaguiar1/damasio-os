name: Apply Quote Review Prequote Fix

on:
  push:
    branches:
      - fix/quote-review-prequote-layout-email-20260823
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply targeted quote fixes
        run: python scripts/apply-quote-review-prequote-fix.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/home/QuoteWizard.tsx app/api/public/quote-alert/route.ts app/api/public/quote-referral/route.ts app/master/page.tsx lib/server/quoteEmail.ts app/public-site-polish.css app/master-platform-polish.css
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "[quote-autopatch] Fix prequotes, quote review search, and result layout"
          git push origin HEAD:fix/quote-review-prequote-layout-email-20260823
