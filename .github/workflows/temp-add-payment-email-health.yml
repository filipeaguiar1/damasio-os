name: Temporary Add Payment Email Health

on:
  push:
    branches:
      - monthly-billing-payment-health-20260823

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monthly-billing-payment-health-20260823
          fetch-depth: 0
      - name: Add invoice email delivery to Payment Health
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/master/payment-health/route.ts')
          text = path.read_text()
          old = '      siteUrl: Boolean(process.env.NEXT_PUBLIC_SITE_URL),\n      platformFeeConfigured: Number.isFinite(Number(process.env.STRIPE_PLATFORM_FEE_PERCENT || "")),'
          new = '      siteUrl: Boolean(process.env.NEXT_PUBLIC_SITE_URL),\n      resendEmail: Boolean(process.env.RESEND_API_KEY),\n      platformFeeConfigured: Number.isFinite(Number(process.env.STRIPE_PLATFORM_FEE_PERCENT || "")),'
          if old not in text:
              raise SystemExit('Payment Health config insertion point not found')
          text = text.replace(old, new, 1)
          old = '      status: legacyRecurring.length ? "critical" : failedCycles.length ? "warning" : "healthy",\n      detail: `${monthlyAgreements.length} active monthly agreement(s), ${dueUnpaidCycles.length} due/unpaid cycle(s), ${legacyRecurring.length} recurring per-Visit agreement(s).`,'
          new = '      status: legacyRecurring.length ? "critical" : failedCycles.length || !config.resendEmail ? "warning" : "healthy",\n      detail: `${monthlyAgreements.length} active monthly agreement(s), ${dueUnpaidCycles.length} due/unpaid cycle(s), ${legacyRecurring.length} recurring per-Visit agreement(s); invoice email ${config.resendEmail ? "configured" : "not configured"}.`,'
          if old not in text:
              raise SystemExit('Monthly Payment Health stage insertion point not found')
          text = text.replace(old, new, 1)
          old = '    if (!config.cronSecret) issues.push({ severity: "critical", code: "cron_secret_missing", message: "CRON_SECRET is missing; monthly billing and scheduled payouts cannot run safely." });'
          new = old + '\n    if (!config.resendEmail) issues.push({ severity: "warning", code: "invoice_email_missing", message: "RESEND_API_KEY is not configured; monthly invoice emails cannot be delivered automatically." });'
          if old not in text:
              raise SystemExit('Payment Health issue insertion point not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git rm -f .github/workflows/temp-add-payment-email-health.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/master/payment-health/route.ts
          git commit -m "Monitor monthly invoice email delivery health"
          git push origin HEAD:monthly-billing-payment-health-20260823
