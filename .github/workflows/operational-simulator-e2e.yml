name: Operational Simulator E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/admin/operational-simulator/**"
      - "app/api/customer/portal-actions/**"
      - "app/admin/performance/**"
      - "lib/repositories/customerPortalRepository.ts"
      - "lib/simulator/**"
      - "supabase/migrations/202607290001_customer_portal_action_contract.sql"
      - "scripts/patch-operational-simulator-photo.py"
      - "scripts/patch-operational-simulator-activity.py"
      - "scripts/patch-operational-simulator-payments.py"
      - "scripts/patch-operational-simulator-feedback.py"
      - "scripts/patch-operational-simulator-tasks.py"
      - "scripts/patch-customer-feedback-fallback.py"
      - "scripts/patch-customer-request-fallback.py"
      - "scripts/patch-customer-portal-board-identity.py"
      - "scripts/patch-customer-portal-legacy-company.py"
      - "scripts/patch-customer-portal-server-actions.py"
      - "tests/operational-simulator.spec.ts"
      - "public/demo/simulation-lawn-after.svg"
      - ".github/workflows/operational-simulator-e2e.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-simulator-v1
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_ACCESS_TOKEN }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - name: Repair canonical simulator compatibility
        run: |
          photo_result=$(python scripts/patch-operational-simulator-photo.py)
          activity_result=$(python scripts/patch-operational-simulator-activity.py)
          payment_result=$(python scripts/patch-operational-simulator-payments.py)
          feedback_result=$(python scripts/patch-operational-simulator-feedback.py)
          task_result=$(python scripts/patch-operational-simulator-tasks.py)
          customer_feedback_result=$(python scripts/patch-customer-feedback-fallback.py)
          customer_request_result=$(python scripts/patch-customer-request-fallback.py)
          board_identity_result=$(python scripts/patch-customer-portal-board-identity.py)
          legacy_company_result=$(python scripts/patch-customer-portal-legacy-company.py)
          server_actions_result=$(python scripts/patch-customer-portal-server-actions.py)
          echo "photo=$photo_result activity=$activity_result payment=$payment_result feedback=$feedback_result task=$task_result customer_feedback=$customer_feedback_result customer_request=$customer_request_result board_identity=$board_identity_result legacy_company=$legacy_company_result server_actions=$server_actions_result"
          if [ "$photo_result" = "changed" ] || [ "$activity_result" = "changed" ] || [ "$payment_result" = "changed" ] || [ "$feedback_result" = "changed" ] || [ "$task_result" = "changed" ] || [ "$customer_feedback_result" = "changed" ] || [ "$customer_request_result" = "changed" ] || [ "$board_identity_result" = "changed" ] || [ "$legacy_company_result" = "changed" ] || [ "$server_actions_result" = "changed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/api/admin/operational-simulator/route.ts lib/repositories/customerPortalRepository.ts
            git commit -m "Align simulator with canonical database permissions"
            git push origin HEAD:feature/25-30-homes-simulator-v1
          fi

      - name: Apply Customer portal database contract
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ.get("SUPABASE_ACCESS_TOKEN") or os.environ.get("SUPABASE_MANAGEMENT_ACCESS_TOKEN")
          if not token:
              print("Supabase management token is not configured; migration remains committed for deployment.")
              sys.exit(0)

          project_url = os.environ.get("NEXT_PUBLIC_SUPABASE_URL", "")
          hostname = urllib.parse.urlparse(project_url).hostname or ""
          project_ref = hostname.split(".")[0]
          if not project_ref:
              raise SystemExit("Could not resolve the Supabase project ref.")

          query = Path("supabase/migrations/202607290001_customer_portal_action_contract.sql").read_text()
          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project_ref}/database/query",
              data=json.dumps({"query": query, "read_only": False}).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  print(f"Customer portal migration applied: HTTP {response.status}")
          except urllib.error.HTTPError as error:
              detail = error.read().decode(errors="replace")
              raise SystemExit(f"Supabase migration failed: HTTP {error.code}: {detail[:1000]}")
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install temporary Playwright package
        run: pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0

      - name: TypeScript and production build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          pnpm start > /tmp/damasio-simulator-server.log 2>&1 &
          echo $! > /tmp/damasio-simulator-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/damasio-simulator-server.log
          exit 1

      - name: Run full two-month operational simulation
        run: pnpm exec playwright test tests/operational-simulator.spec.ts --reporter=line --workers=1

      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-simulator-e2e
          path: |
            operational-simulator.png
            employee-live-route.png
            customer-feedback-result.png
            customer-feedback.png
            /tmp/damasio-simulator-server.log
          if-no-files-found: ignore
