name: Operational Simulator E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "app/employee/route/page.tsx"
      - "components/admin/OfficialRoutePlanMap.tsx"
      - "tests/canonical-route-sync.spec.ts"
      - "scripts/apply-final-ui-network-stability.py"
      - ".github/workflows/operational-simulator-e2e.yml"
      - ".github/workflows/apply-official-route-branch.yml"

permissions:
  contents: write

concurrency:
  group: apply-final-route-stability
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply final UI and network stability patch
        run: python scripts/apply-final-ui-network-stability.py
      - name: Preserve legacy active status compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/employee/route/page.tsx")
          text = path.read_text()
          old = '|| selected?.canonicalVisitStatus==="active"'
          new = '|| (selected?.canonicalVisitStatus as string)==="active"'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one legacy active comparison, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Restore permanent workflows and remove staging script
        shell: bash
        run: |
          git show c528e24dc64054d381aa27b7b0ce81349e923443:.github/workflows/operational-simulator-e2e.yml > .github/workflows/operational-simulator-e2e.yml
          git show c528e24dc64054d381aa27b7b0ce81349e923443:.github/workflows/apply-official-route-branch.yml > .github/workflows/apply-official-route-branch.yml
          rm scripts/apply-final-ui-network-stability.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit final route stability changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/employee/route/page.tsx components/admin/OfficialRoutePlanMap.tsx tests/canonical-route-sync.spec.ts scripts/apply-final-ui-network-stability.py .github/workflows/operational-simulator-e2e.yml .github/workflows/apply-official-route-branch.yml
          git commit -m "fix: finalize canonical route status and fetch resilience"
          git push origin HEAD:feature/25-30-homes-simulator-v1
