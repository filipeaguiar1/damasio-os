name: Apply Canonical Admin Read Fix

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-canonical-admin-read-fix.py"
      - ".github/workflows/operational-simulator-e2e.yml"

permissions:
  contents: write

concurrency:
  group: apply-canonical-admin-read-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply canonical Admin read fix
        run: python scripts/apply-canonical-admin-read-fix.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated functional changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/customers/route.ts app/api/admin/routes/route.ts
          git commit -m "fix: make canonical Admin reads single-source and read-only"
          git push origin HEAD:feature/25-30-homes-simulator-v1
