name: Apply Canonical Live Date E2E Alignment

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-canonical-live-date-test.py"
      - ".github/workflows/operational-simulator-e2e.yml"

permissions:
  contents: write

concurrency:
  group: apply-canonical-live-date-test
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Align E2E with the canonical simulation date
        run: python scripts/apply-canonical-live-date-test.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated test alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/canonical-route-sync.spec.ts
          git commit -m "test: use canonical simulator live date for route sync"
          git push origin HEAD:feature/25-30-homes-simulator-v1
