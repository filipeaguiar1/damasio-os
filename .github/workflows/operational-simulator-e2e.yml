name: Operational Simulator E2E
# Single authenticated writer gate for the shared QA database.
# V1, canonical four-screen Route, V2 scale and Full Ecosystem run sequentially.
# Revalidation marker: canonical UI assertions now foreground each surface before checking the rendered version.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/admin/**"
      - "app/api/master/**"
      - "app/api/customer/**"
      - "app/api/mobile/**"
      - "app/api/stripe/**"
      - "app/api/map/**"
      - "app/admin/performance/**"
      - "app/employee/route/page.tsx"
      - "app/mobile/admin/routes/page.tsx"
      - "app/mobile/employee/page.tsx"
      - "components/admin/OfficialRoutePlanMap.tsx"
      - "components/mobile/EmployeeRouteMap.tsx"
      - "lib/hooks/useCanonicalRouteSnapshot.ts"
      - "lib/repositories/customerPortalRepository.ts"
      - "lib/routes/**"
      - "lib/services/routeMapService.ts"
      - "lib/simulator/**"
      - "scripts/purge-operational-simulation-v1.mjs"
      - "scripts/qa-final-two-blockers.py"
      - "scripts/qa-finalize-operational-blockers.py"
      - "scripts/validate-advanced-simulation.mjs"
      - "supabase/migrations/202607290001_customer_portal_action_contract.sql"
      - "supabase/migrations/202608020700_canonical_route_snapshot_cleanup.sql"
      - "supabase/migrations/202608030930_remove_recursive_route_stop_sync.sql"
      - "supabase/migrations/202608031030_canonical_route_one_way_projection.sql"
      - "supabase/migrations/202608031100_lock_active_canonical_route_order.sql"
      - "supabase/migrations/202608050100_repair_corrupted_canonical_route_order.sql"
      - "supabase/migrations/202608070002_operational_simulator_visit_cleanup.sql"
      - "supabase/migrations/202608071610_route_stops_visit_projection.sql"
      - "supabase/migrations/202608071620_route_employee_lookup_indexes.sql"
      - "supabase/migrations/202608080100_advanced_operational_simulation_namespace.sql"
      - "supabase/migrations/202608100120_advanced_simulation_route_cleanup.sql"
      - "supabase/migrations/202608100210_operational_simulation_exact_purge.sql"
      - "tests/operational-simulator.spec.ts"
      - "tests/canonical-route-sync.spec.ts"
      - "tests/advanced-operational-simulator*.spec.ts"
      - "tests/full-ecosystem*.spec.ts"
      - "public/demo/simulation-lawn-after.svg"
      - ".github/workflows/operational-simulator-e2e.yml"
      - ".github/workflows/advanced-simulation-e2e.yml"
      - ".github/workflows/full-ecosystem-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit needs to mutate the shared QA database. Static PR checks
# run independently; stale heavy runs are cancelled when a newer commit arrives.
concurrency:
  group: damasio-release-heavy-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify canonical database contract sources
        run: |
          python - <<'PY'
          from pathlib import Path
          migrations = {
              "supabase/migrations/202607290001_customer_portal_action_contract.sql": [],
              "supabase/migrations/202608020700_canonical_route_snapshot_cleanup.sql": [],
              "supabase/migrations/202608030930_remove_recursive_route_stop_sync.sql": ["route_stops_sync_visit_order_insert", "route_stops_sync_visit_order_update", "route_stops_sync_visit_order_delete"],
              "supabase/migrations/202608031030_canonical_route_one_way_projection.sql": ["sync_canonical_route_stops_v2", "update public.visits"],
              "supabase/migrations/202608031100_lock_active_canonical_route_order.sql": ["guard_active_canonical_route_order_trigger"],
              "supabase/migrations/202608050100_repair_corrupted_canonical_route_order.sql": ["route_order_audit", "route_stops"],
              "supabase/migrations/202608070002_operational_simulator_visit_cleanup.sql": ["cleanup_operational_simulation_visits", "service_role"],
              "supabase/migrations/202608071610_route_stops_visit_projection.sql": ["project_route_stop_to_visit_order", "route_stops", "visits"],
              "supabase/migrations/202608071620_route_employee_lookup_indexes.sql": ["employees_profile_id_idx", "profiles_company_role_active_name_idx"],
              "supabase/migrations/202608080100_advanced_operational_simulation_namespace.sql": ["operational_simulation_runs"],
              "supabase/migrations/202608100120_advanced_simulation_route_cleanup.sql": ["cleanup_operational_simulation_routes", "service_role"],
              "supabase/migrations/202608100210_operational_simulation_exact_purge.sql": ["purge_operational_simulation_v1_run", "purge_operational_simulation_v2_namespace", "service_role"],
          }
          for path, required_fragments in migrations.items():
              source = Path(path)
              if not source.is_file():
                  raise SystemExit(f"Missing canonical migration source: {path}")
              text = source.read_text().lower()
              for fragment in required_fragments:
                  if fragment.lower() not in text:
                      raise SystemExit(f"Canonical migration source {path} is missing contract fragment: {fragment}")
          print("Canonical database migration sources are present and structurally verified.")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install temporary Playwright package
        run: pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0

      - name: TypeScript and production build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          pnpm start > /tmp/damasio-release-heavy-e2e.log 2>&1 &
          echo $! > /tmp/damasio-release-heavy-e2e.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/damasio-release-heavy-e2e.log
          exit 1

      - name: Run V1 two-month operational simulation
        run: pnpm exec playwright test tests/operational-simulator.spec.ts --reporter=line --workers=1

      - name: Validate canonical route on four authenticated screens
        run: pnpm exec playwright test tests/canonical-route-sync.spec.ts --reporter=line --workers=1

      - name: Purge exact V1 simulation run
        if: always()
        run: node scripts/purge-operational-simulation-v1.mjs

      - name: Run V2 namespace isolation and idempotent reset gate
        if: ${{ success() }}
        run: pnpm exec playwright test tests/advanced-operational-simulator.spec.ts --reporter=line --workers=1

      - name: Run V2 Customer-to-History journey gate
        if: ${{ success() }}
        run: pnpm exec playwright test tests/advanced-operational-simulator-journey.spec.ts --reporter=line --workers=1

      - name: Run V2 4,620-service zero-residue release gate
        if: ${{ success() }}
        run: pnpm exec playwright test tests/advanced-operational-simulator-large.spec.ts --reporter=line --workers=1

      - name: Run Full Ecosystem journeys
        if: ${{ success() }}
        run: pnpm exec playwright test tests/full-ecosystem.spec.ts tests/full-ecosystem-smart-route.spec.ts tests/full-ecosystem-stripe.spec.ts tests/full-ecosystem-tenant-isolation.spec.ts --reporter=line --workers=1

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-simulator-e2e
          path: |
            operational-simulator.png
            employee-live-route.png
            customer-feedback-result.png
            customer-feedback.png
            customer-desktop-qa.png
            canonical-admin-web.png
            canonical-admin-mobile.png
            canonical-employee-web.png
            canonical-employee-mobile.png
            /tmp/damasio-release-heavy-e2e.log
            test-results/**
          if-no-files-found: ignore
