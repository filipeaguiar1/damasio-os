name: Operational Simulator E2E
# Final authenticated release gate for the canonical Route.
# Exercises Admin and Employee web/mobile against one versioned snapshot.
# The E2E gate never applies database migrations; schema changes must be deployed separately.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/admin/operational-simulator/**"
      - "app/api/customer/portal-actions/**"
      - "app/api/map/**"
      - "app/admin/performance/**"
      - "app/employee/route/page.tsx"
      - "app/mobile/admin/routes/page.tsx"
      - "app/mobile/employee/page.tsx"
      - "components/admin/OfficialRoutePlanMap.tsx"
      - "components/mobile/EmployeeRouteMap.tsx"
      - "lib/hooks/useCanonicalRouteSnapshot.ts"
      - "lib/repositories/customerPortalRepository.ts"
      - "lib/routes/canonicalRouteSnapshot.ts"
      - "lib/routes/verifyCanonicalRoutePersistence.ts"
      - "lib/services/routeMapService.ts"
      - "lib/simulator/**"
      - "supabase/migrations/202607290001_customer_portal_action_contract.sql"
      - "supabase/migrations/202608020700_canonical_route_snapshot_cleanup.sql"
      - "supabase/migrations/202608030930_remove_recursive_route_stop_sync.sql"
      - "supabase/migrations/202608031030_canonical_route_one_way_projection.sql"
      - "supabase/migrations/202608031100_lock_active_canonical_route_order.sql"
      - "supabase/migrations/202608050100_repair_corrupted_canonical_route_order.sql"
      - "tests/operational-simulator.spec.ts"
      - "tests/canonical-route-sync.spec.ts"
      - "public/demo/simulation-lawn-after.svg"
      - ".github/workflows/operational-simulator-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-simulator-v1
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify canonical database contract sources
        run: |
          python - <<'PY'
          from pathlib import Path
          migrations = {
              "supabase/migrations/202607290001_customer_portal_action_contract.sql": [],
              "supabase/migrations/202608020700_canonical_route_snapshot_cleanup.sql": [],
              "supabase/migrations/202608030930_remove_recursive_route_stop_sync.sql": ["route_stops_sync_visit_order_insert", "route_stops_sync_visit_order_update", "route_stops_sync_visit_order_delete"],
              "supabase/migrations/202608031030_canonical_route_one_way_projection.sql": ["sync_canonical_route_stops_v2", "update public.visits"],
              "supabase/migrations/202608031100_lock_active_canonical_route_order.sql": ["guard_active_canonical_route_order_trigger"],
              "supabase/migrations/202608050100_repair_corrupted_canonical_route_order.sql": ["route_order_audit", "route_stops"],
          }
          for path, required_fragments in migrations.items():
              source = Path(path)
              if not source.is_file(): raise SystemExit(f"Missing canonical migration source: {path}")
              text = source.read_text().lower()
              for fragment in required_fragments:
                  if fragment.lower() not in text: raise SystemExit(f"Canonical migration source {path} is missing contract fragment: {fragment}")
          print("Canonical database migration sources are present and structurally verified.")
          PY

      - name: Patch simulator cleanup convergence for validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/api/admin/operational-simulator/route.ts")
          text = path.read_text()
          old = '    await remove("route_stops", service.from("route_stops").delete().in("route_id", routeIds));\n    await remove("employee_smart_route_state", service.from("employee_smart_route_state").delete().in("route_id", routeIds));'
          new = '    await remove("employee_smart_route_state", service.from("employee_smart_route_state").delete().in("route_id", routeIds));\n    await remove("route_stops", service.from("route_stops").delete().in("route_id", routeIds));'
          if old not in text: raise SystemExit("Simulator cleanup ordering patch target was not found.")
          text = text.replace(old, new, 1)
          old_remove = '''      const removed = await removeSimulation(service, companyId);
      return NextResponse.json({ removed: true, ...removed, message: `${removed.customersRemoved} simulation customers and ${removed.accountsRemoved} temporary accounts removed.` });'''
          new_remove = '''      let removed = await removeSimulation(service, companyId);
      let remaining = await simulationStatus(service, companyId);
      for (let attempt = 0; remaining.exists && attempt < 2; attempt += 1) {
        await new Promise(resolve => setTimeout(resolve, 250 * (attempt + 1)));
        const retry = await removeSimulation(service, companyId);
        removed = {
          customersRemoved: Math.max(removed.customersRemoved, retry.customersRemoved),
          accountsRemoved: removed.accountsRemoved + retry.accountsRemoved,
        };
        remaining = await simulationStatus(service, companyId);
      }
      if (remaining.exists) throw new Error(`Simulation cleanup did not converge: ${remaining.customerCount} simulation customers remain.`);
      return NextResponse.json({ removed: true, ...removed, message: `${removed.customersRemoved} simulation customers and ${removed.accountsRemoved} temporary accounts removed.` });'''
          if old_remove not in text: raise SystemExit("Simulator cleanup postcondition target was not found.")
          path.write_text(text.replace(old_remove, new_remove, 1))
          print("Simulator remove now confirms exists=false before reporting success in this validation run.")
          PY

      - name: Patch canonical map source authority for validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("components/mobile/EmployeeRouteMap.tsx")
          text = path.read_text()
          old = "    && sameVisitMembership(operationalRoute, snapshot);"
          new = "    && (Boolean(routeId) || sameVisitMembership(operationalRoute, snapshot));"
          if old not in text: raise SystemExit("Canonical map authority patch target was not found.")
          path.write_text(text.replace(old, new, 1))
          print("Explicit canonical routeId now makes route_stops snapshot authoritative in this validation run.")
          PY

      - name: Patch Admin mobile canonical bootstrap for validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/mobile/admin/routes/page.tsx")
          text = path.read_text()
          hook_import = 'import { useCanonicalRouteSnapshot } from "@/lib/hooks/useCanonicalRouteSnapshot";'
          snapshot_import = 'import type { CanonicalRouteSnapshot } from "@/lib/routes/canonicalRouteSnapshot";'
          if snapshot_import not in text:
              if hook_import not in text: raise SystemExit("Admin canonical hook import was not found.")
              text = text.replace(hook_import, hook_import + "\n" + snapshot_import, 1)
          state_marker = '  const [canonicalRouteId, setCanonicalRouteId] = useState<string | null>(null);'
          bootstrap_state = '  const [canonicalBootstrap, setCanonicalBootstrap] = useState<CanonicalRouteSnapshot | null>(null);'
          if bootstrap_state not in text:
              if state_marker not in text: raise SystemExit("Admin canonical route state was not found.")
              text = text.replace(state_marker, state_marker + "\n" + bootstrap_state, 1)
          pattern = re.compile(r'  useEffect\(\(\) => \{\s+let cancelled = false;\s+setCanonicalRouteId\(null\);.*?\n  \}, \[employee\?\.id, date\]\);', re.S)
          replacement = '''  useEffect(() => {
            let cancelled = false;
            setCanonicalRouteId(null);
            setCanonicalBootstrap(null);
            if (!employee?.id || !date) return () => { cancelled = true; };
            const resolveCanonicalRoute = async () => {
              let lastError: unknown = null;
              for (const delay of [0, 250, 750, 1500, 3000]) {
                if (delay) await new Promise(resolve => window.setTimeout(resolve, delay));
                if (cancelled) return;
                try {
                  const resolved = await api(`/api/admin/canonical-route?profileId=${encodeURIComponent(employee.id)}&date=${encodeURIComponent(date)}`);
                  const routeId = String(resolved.routeId || "").trim();
                  if (!routeId) throw new Error("Canonical Route resolver returned no routeId.");
                  const snapshot = await api(`/api/map/canonical-route-current?routeId=${encodeURIComponent(routeId)}`) as CanonicalRouteSnapshot;
                  if (String(snapshot.routeId || "") !== routeId || !Array.isArray(snapshot.stops)) throw new Error("Canonical Route snapshot did not match the resolved routeId.");
                  if (cancelled) return;
                  setCanonicalRouteId(routeId);
                  setCanonicalBootstrap(snapshot);
                  setMessage("");
                  return;
                } catch (error) { lastError = error; }
              }
              if (!cancelled) setMessage(lastError instanceof Error ? lastError.message : "Canonical Route could not be resolved.");
            };
            void resolveCanonicalRoute();
            return () => { cancelled = true; };
          }, [employee?.id, date]);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1: raise SystemExit(f"Admin mobile resolver patch matched {count} blocks.")
          hook_old = '  const { snapshot: canonicalSnapshot, error: canonicalError, loading: canonicalLoading } = useCanonicalRouteSnapshot(canonicalRouteId);'
          hook_new = '  const { snapshot: liveCanonicalSnapshot, error: canonicalError, loading: canonicalLoading } = useCanonicalRouteSnapshot(canonicalRouteId);\n  const canonicalSnapshot = liveCanonicalSnapshot || canonicalBootstrap;'
          if hook_old not in text: raise SystemExit("Admin canonical hook target was not found.")
          text = text.replace(hook_old, hook_new, 1)
          error_old = '  useEffect(() => {\n    if (canonicalError) setMessage(canonicalError);\n  }, [canonicalError]);'
          error_new = '  useEffect(() => {\n    if (canonicalError && !canonicalBootstrap) setMessage(canonicalError);\n  }, [canonicalError, canonicalBootstrap]);'
          if error_old not in text: raise SystemExit("Admin canonical error effect target was not found.")
          path.write_text(text.replace(error_old, error_new, 1))
          print("Admin mobile now bootstraps from the exact canonical snapshot in this validation run.")
          PY

      - name: Add Admin mobile route resolver diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/canonical-route-sync.spec.ts")
          text = path.read_text()
          marker = "  await adminMobile.locator('input[type=\"date\"]').first().fill(routeDate);"
          addition = '''
            const adminMobileResolved = await authRequest<any>(adminMobile, `/api/admin/canonical-route?profileId=${encodeURIComponent(worker.id)}&date=${encodeURIComponent(routeDate)}`);
            console.log("ADMIN_MOBILE_RESOLVER:", JSON.stringify(adminMobileResolved));
            console.log("ADMIN_MOBILE_BODY:", (await adminMobile.locator("body").innerText()).slice(0, 1600));'''
          if marker not in text: raise SystemExit("Admin mobile diagnostic marker was not found.")
          path.write_text(text.replace(marker, marker + addition, 1))
          print("Admin mobile diagnostics added for this validation run.")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install temporary Playwright package
        run: pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0

      - name: TypeScript and production build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          pnpm start > /tmp/damasio-simulator-server.log 2>&1 &
          echo $! > /tmp/damasio-simulator-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/damasio-simulator-server.log
          exit 1

      - name: Run full two-month operational simulation
        run: pnpm exec playwright test tests/operational-simulator.spec.ts --reporter=line --workers=1

      - name: Validate canonical route on four authenticated screens
        if: ${{ !cancelled() }}
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm is unavailable because runner setup did not complete."
            exit 1
          fi
          pnpm exec playwright test tests/canonical-route-sync.spec.ts --reporter=line --workers=1

      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-simulator-e2e
          path: |
            operational-simulator.png
            employee-live-route.png
            customer-feedback-result.png
            customer-feedback.png
            customer-desktop-qa.png
            canonical-admin-web.png
            canonical-admin-mobile.png
            canonical-employee-web.png
            canonical-employee-mobile.png
            /tmp/damasio-simulator-server.log
          if-no-files-found: ignore
