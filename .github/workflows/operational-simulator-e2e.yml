name: Operational Simulator E2E
# Final authenticated release gate for the canonical Route.
# This branch temporarily applies the remaining QA fixes in the runner and only
# commits them if both focused E2E gates pass without changing assertions/timeouts.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/admin/operational-simulator/**"
      - "app/api/customer/portal-actions/**"
      - "app/api/map/**"
      - "app/admin/performance/**"
      - "app/employee/route/page.tsx"
      - "app/mobile/admin/routes/page.tsx"
      - "app/mobile/employee/page.tsx"
      - "components/admin/OfficialRoutePlanMap.tsx"
      - "components/mobile/EmployeeRouteMap.tsx"
      - "lib/hooks/useCanonicalRouteSnapshot.ts"
      - "lib/repositories/customerPortalRepository.ts"
      - "lib/routes/canonicalRouteSnapshot.ts"
      - "lib/routes/projectCanonicalVisitOrderCompatibility.ts"
      - "lib/routes/verifyCanonicalRoutePersistence.ts"
      - "lib/services/routeMapService.ts"
      - "lib/simulator/**"
      - "scripts/qa-final-two-blockers.py"
      - "supabase/migrations/202607290001_customer_portal_action_contract.sql"
      - "supabase/migrations/202608020700_canonical_route_snapshot_cleanup.sql"
      - "supabase/migrations/202608030930_remove_recursive_route_stop_sync.sql"
      - "supabase/migrations/202608031030_canonical_route_one_way_projection.sql"
      - "supabase/migrations/202608031100_lock_active_canonical_route_order.sql"
      - "supabase/migrations/202608050100_repair_corrupted_canonical_route_order.sql"
      - "supabase/migrations/202608070002_operational_simulator_visit_cleanup.sql"
      - "supabase/migrations/202608071610_route_stops_visit_projection.sql"
      - "supabase/migrations/202608071620_route_employee_lookup_indexes.sql"
      - "tests/operational-simulator.spec.ts"
      - "tests/canonical-route-sync.spec.ts"
      - "public/demo/simulation-lawn-after.svg"
      - ".github/workflows/operational-simulator-e2e.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-simulator-v1
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
          fetch-depth: 0

      - name: Apply remaining blocker candidates
        run: |
          python scripts/qa-final-two-blockers.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/api/admin/operational-simulator/route.ts")
          text = path.read_text()

          type_replacements = {
              '  const customerIds = (customers.data || []).map((row: any) => String(row.id));': '  const customerIds: string[] = (customers.data || []).map((row: any) => String(row.id));',
              '  const profileIds = [...new Set([': '  const profileIds: string[] = [...new Set<string>([',
              '  const routeIds = [...new Set(visitRows.map((row: any) => row.route_id ? String(row.route_id) : "").filter(Boolean))];': '  const routeIds: string[] = [...new Set<string>(visitRows.map((row: any) => row.route_id ? String(row.route_id) : "").filter(Boolean))];',
              '  const crewIds = [...new Set(employeeRows.map((row: any) => row.crew_id ? String(row.crew_id) : "").filter(Boolean))];': '  const crewIds: string[] = [...new Set<string>(employeeRows.map((row: any) => row.crew_id ? String(row.crew_id) : "").filter(Boolean))];',
              '    for (const batch of chunks(customerIds, 4)) {': '    for (const batch of chunks<string>(customerIds, 4)) {',
          }
          for old, new in type_replacements.items():
              if old not in text:
                  raise SystemExit(f"Cleanup type anchor not found: {old}")
              text = text.replace(old, new, 1)

          customer_pattern = re.compile(
              r'  const customers = await service\.from\("customers"\)\.select\("id,profile_id"\)\s*\n\s*\.or\(companyFilter\(companyId\)\)\.like\("email", pattern\);'
          )
          customer_replacement = '''  const activeCustomers = await service.from("customers").select("id,profile_id")
            .or(companyFilter(companyId)).like("email", pattern).is("archived_at", null).limit(120);
          if (activeCustomers.error) throw new Error(activeCustomers.error.message);
          const archivedCustomers = await service.from("customers").select("id,profile_id")
            .or(companyFilter(companyId)).like("email", pattern).not("archived_at", "is", null).limit(4);
          if (archivedCustomers.error) throw new Error(archivedCustomers.error.message);
          const customers = {
            data: [...(activeCustomers.data || []), ...(archivedCustomers.data || [])],
            error: null as { message: string } | null,
          };'''
          customer_replacement = "\n".join(
              ("  " + line if line and not line.startswith("  ") else line)
              for line in customer_replacement.splitlines()
          )
          customer_replacement = customer_replacement.replace("      .or", "    .or")
          text, count = customer_pattern.subn(customer_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Customer cleanup query patch matched {count} blocks")

          worker_pattern = re.compile(
              r'  const workerProfiles = await service\.from\("profiles"\)\.select\("id"\)\s*\n\s*\.eq\("role", "employee"\)\.or\(companyFilter\(companyId\)\)\.like\("email", pattern\);'
          )
          worker_replacement = '''  const workerProfiles = await service.from("profiles").select("id")
            .eq("role", "employee").eq("active", true).or(companyFilter(companyId)).like("email", pattern);'''
          worker_replacement = "\n".join(
              ("  " + line if line and not line.startswith("  ") else line)
              for line in worker_replacement.splitlines()
          )
          worker_replacement = worker_replacement.replace("      .eq", "    .eq")
          text, count = worker_pattern.subn(worker_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Active simulator worker patch matched {count} blocks")

          delete_pattern = re.compile(
              r'(\s+const batchRemoved = await remove\(label, service\.from\(table\)\.delete\(\)\.in\(field, batch\), optional\);\n)(\s+)(removed = batchRemoved && removed;)'
          )
          text, count = delete_pattern.subn(r'\1\2if (!batchRemoved && optional) return false;\n\2\3', text, count=1)
          if count != 1:
              raise SystemExit(f"Optional delete short-circuit patch matched {count} blocks")

          update_pattern = re.compile(
              r'(\s+const batchUpdated = await remove\(label, service\.from\(table\)\.update\(values\)\.in\(field, batch\), optional\);\n)(\s+)(updated = batchUpdated && updated;)'
          )
          text, count = update_pattern.subn(r'\1\2if (!batchUpdated && optional) return false;\n\2\3', text, count=1)
          if count != 1:
              raise SystemExit(f"Optional update short-circuit patch matched {count} blocks")

          replacements = {
              '    await removeByIds("route_stops", "route_stops", "route_id", routeIds);': '''    for (const batch of chunks(routeIds, 25)) {
              await remove("route_stops", service.from("route_stops").delete().in("route_id", batch));
            }'''.replace("              await", "      await").replace("            }", "    }"),
              '    await removeByIds("route_order_state", "route_order_state", "route_id", routeIds);': '''    for (const batch of chunks(routeIds, 25)) {
              await remove("route_order_state", service.from("route_order_state").delete().in("route_id", batch));
            }'''.replace("              await", "      await").replace("            }", "    }"),
              '    if (routeIds.length) await removeByIds("routes", "routes", "id", routeIds);': '    if (routeIds.length) await removeByIds("routes", "routes", "id", routeIds, true);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Explicit canonical cleanup anchor not found: {old}")
              text = text.replace(old, new, 1)

          core_cleanup_pattern = re.compile(
              r'  if \(visitsDeleted\) \{.*?\n  \}\n\n  const storageDelete',
              re.S,
          )
          core_cleanup_replacement = '''  if (!visitsDeleted) {
            console.warn("operational-simulator cleanup archived core rows because Visit deletion was unavailable.");
          }
          const archivedAt = new Date().toISOString();
          if (customerIds.length) await updateByIds("archive customers", "customers", { archived_at: archivedAt }, "id", customerIds);
          if (jobIds.length) await updateByIds("deactivate jobs", "jobs", { active: false }, "id", jobIds);
          if (employeeIds.length) await updateByIds("deactivate employees", "employees", { active: false }, "id", employeeIds);
          if (crewIds.length) await updateByIds("deactivate crews", "crews", { active: false }, "id", crewIds);
          if (profileIds.length) await updateByIds("deactivate profiles", "profiles", { active: false }, "id", profileIds);

          const storageDelete'''
          core_cleanup_replacement = "\n".join(
              ("  " + line if line and not line.startswith("  ") else line)
              for line in core_cleanup_replacement.splitlines()
          )
          text, count = core_cleanup_pattern.subn(core_cleanup_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Protected core archive patch matched {count} blocks")

          path.write_text(text)
          PY
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify canonical database contract sources
        run: |
          python - <<'PY'
          from pathlib import Path
          migrations = {
              "supabase/migrations/202607290001_customer_portal_action_contract.sql": [],
              "supabase/migrations/202608020700_canonical_route_snapshot_cleanup.sql": [],
              "supabase/migrations/202608030930_remove_recursive_route_stop_sync.sql": ["route_stops_sync_visit_order_insert", "route_stops_sync_visit_order_update", "route_stops_sync_visit_order_delete"],
              "supabase/migrations/202608031030_canonical_route_one_way_projection.sql": ["sync_canonical_route_stops_v2", "update public.visits"],
              "supabase/migrations/202608031100_lock_active_canonical_route_order.sql": ["guard_active_canonical_route_order_trigger"],
              "supabase/migrations/202608050100_repair_corrupted_canonical_route_order.sql": ["route_order_audit", "route_stops"],
              "supabase/migrations/202608070002_operational_simulator_visit_cleanup.sql": ["cleanup_operational_simulation_visits", "service_role"],
              "supabase/migrations/202608071610_route_stops_visit_projection.sql": ["project_route_stop_to_visit_order", "route_stops", "visits"],
              "supabase/migrations/202608071620_route_employee_lookup_indexes.sql": ["employees_profile_id_idx", "profiles_company_role_active_name_idx"],
          }
          for path, required_fragments in migrations.items():
              source = Path(path)
              if not source.is_file(): raise SystemExit(f"Missing canonical migration source: {path}")
              text = source.read_text().lower()
              for fragment in required_fragments:
                  if fragment.lower() not in text: raise SystemExit(f"Canonical migration source {path} is missing contract fragment: {fragment}")
          print("Canonical database migration sources are present and structurally verified.")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install temporary Playwright package
        run: pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0

      - name: TypeScript and production build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          pnpm start > /tmp/damasio-simulator-server.log 2>&1 &
          echo $! > /tmp/damasio-simulator-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/damasio-simulator-server.log
          exit 1

      - name: Run full two-month operational simulation
        run: pnpm exec playwright test tests/operational-simulator.spec.ts --reporter=line --workers=1

      - name: Validate canonical route on four authenticated screens
        if: ${{ !cancelled() }}
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm is unavailable because runner setup did not complete."
            exit 1
          fi
          pnpm exec playwright test tests/canonical-route-sync.spec.ts --reporter=line --workers=1

      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-simulator-e2e
          path: |
            operational-simulator.png
            employee-live-route.png
            customer-feedback-result.png
            customer-feedback.png
            customer-desktop-qa.png
            canonical-admin-web.png
            canonical-admin-mobile.png
            canonical-employee-web.png
            canonical-employee-mobile.png
            /tmp/damasio-simulator-server.log
          if-no-files-found: ignore

      - name: Commit validated fixes and restore normal QA gate
        if: success()
        run: |
          git checkout 28e5bba45ace5977c1b4a7b76e02a75d2fdbaa08 -- .github/workflows/operational-simulator-e2e.yml
          git rm -f scripts/qa-final-two-blockers.py
          if [ -f .github/workflows/qa-final-two-blockers.yml ]; then git rm -f .github/workflows/qa-final-two-blockers.yml; fi
          git config user.name "Damasio QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/admin/operational-simulator/route.ts app/api/admin/operational-simulator/exceptions/route.ts lib/routes/projectCanonicalVisitOrderCompatibility.ts lib/repositories/customerPortalRepository.ts .github/workflows/operational-simulator-e2e.yml
          git diff --cached --check
          git commit -m "Fix remaining operational QA blockers"
          git push origin HEAD:qa/full-ecosystem-e2e-20260807
