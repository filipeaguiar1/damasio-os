name: Apply Admin Session Refresh Repair

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-admin-session-refresh.py"
      - ".github/workflows/operational-simulator-e2e.yml"

permissions:
  contents: write

concurrency:
  group: apply-admin-session-refresh
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply Admin session refresh repair
        run: python scripts/apply-admin-session-refresh.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated session repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/repositories/customerPropertyRepository.ts tests/canonical-route-sync.spec.ts
          git commit -m "fix: refresh Admin sessions for canonical route reads"
          git push origin HEAD:feature/25-30-homes-simulator-v1
