name: Operational Simulator E2E
# Temporary diagnostic harness for the final Employee Mobile convergence blocker.
# Assertions and their timeouts remain untouched.

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/mobile/employee/page.tsx"
      - "components/mobile/EmployeeRouteMap.tsx"
      - "lib/hooks/useCanonicalRouteSnapshot.ts"
      - "lib/routes/canonicalRouteSnapshot.ts"
      - "lib/services/routeMapService.ts"
      - "tests/canonical-route-sync.spec.ts"
      - ".github/workflows/operational-simulator-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-simulator-v1
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
          fetch-depth: 0

      - name: Add Employee Mobile diagnostics in runner only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/canonical-route-sync.spec.ts")
          lines = path.read_text().splitlines()
          marker = '  for (const [page, label] of ['
          matches = [index for index, line in enumerate(lines) if line == marker]
          if len(matches) < 2:
              raise SystemExit(f"expected at least two four-screen assertion loops, found {len(matches)}")
          insert_at = matches[1]
          diagnostics = [
              '  console.log("EMPLOYEE_MOBILE_AFTER_CHANGE_URL:", employeeMobile.url());',
              '  console.log("EMPLOYEE_MOBILE_AFTER_CHANGE_BODY:", (await employeeMobile.locator("body").innerText()).slice(0, 8000));',
              '  console.log("EMPLOYEE_MOBILE_AFTER_CHANGE_CANONICAL_TEXTS:", await employeeMobile.getByText(/Canonical route v\\d+/i).allTextContents());',
              '  console.log("EMPLOYEE_MOBILE_AFTER_CHANGE_MARKERS:", await employeeMobile.locator(".employee-map-marker").count());',
              '  console.log("EMPLOYEE_MOBILE_AFTER_CHANGE_MAPS:", await employeeMobile.locator(".role-map-card").count());',
              '  console.log("EMPLOYEE_MOBILE_AFTER_CHANGE_ROUTE_TOGGLES:", await employeeMobile.getByRole("button", { name: /List|Map/ }).allTextContents());',
              '  await employeeMobile.screenshot({ path: "canonical-employee-mobile-before-assert.png", fullPage: true });',
              '',
          ]
          lines[insert_at:insert_at] = diagnostics
          path.write_text("\n".join(lines) + "\n")
          PY
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0
      - name: Build and canonical guardrails
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          pnpm start > /tmp/damasio-mobile-diagnostic.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/damasio-mobile-diagnostic.log
          exit 1

      - name: Run canonical route sync diagnostic gate
        run: pnpm exec playwright test tests/canonical-route-sync.spec.ts --reporter=line --workers=1

      - name: Upload Employee Mobile diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-mobile-canonical-diagnostic
          path: |
            canonical-employee-mobile-before-assert.png
            canonical-employee-web.png
            /tmp/damasio-mobile-diagnostic.log
          if-no-files-found: ignore
