name: Apply focused Admin improvements v2

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - .github/workflows/agent-apply-admin-improvements-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source changes
        run: python scripts/apply-admin-improvements.py
      - name: Verify real diff
        run: |
          git diff --check
          git diff --quiet && { echo "No source changes were applied"; exit 1; } || true
          grep -q 'getPropertyPhotoHistory(next.property.id).catch' "app/admin/customers/[id]/page.tsx"
          ! grep -q '\["Dashboard", "/admin/command"\]' components/admin/AdminShell.tsx
          grep -q 'V53.2 focused Admin layout' app/globals.css
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate
        run: |
          pnpm check
          pnpm build
      - name: Commit verified source
        run: |
          rm -f .github/workflows/agent-apply-admin-improvements-v2.yml
          rm -f .github/workflows/agent-apply-admin-improvements.yml
          rm -f .github/workflows/agent-apply-admin-improvements.json
          rm -f scripts/apply-admin-improvements.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Admin layouts and speed up property profiles"
          git push origin HEAD:feature/25-30-homes-simulator-v1
