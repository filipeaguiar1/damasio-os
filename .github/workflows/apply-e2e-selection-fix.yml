name: Apply canonical Employee selection repair

on:
  push:
    branches:
      - agent/overnight-e2e-qa

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/overnight-e2e-qa
      - name: Preserve canonical Visit selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/mobile/employee/page.tsx")
          text = path.read_text()
          old = '      setSelectedId(current=>current&&rows.some(row=>row.id===current||row.canonicalVisitId===current)?current:(rows[0]?.id||""));'
          new = '      setSelectedId(current=>current&&(rows.some(row=>row.id===current||row.canonicalVisitId===current)||mapContext.stops.some(stop=>stop.visitId===current))?current:(rows[0]?.id||mapContext.stops[0]?.visitId||""));'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("selection guard not found")
          path.write_text(text)
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mobile/employee/page.tsx
          git commit -m "fix: preserve canonical employee visit selection"
          git push origin HEAD:agent/overnight-e2e-qa
