name: Apply verified E2E selection fix

on:
  push:
    branches:
      - agent/overnight-e2e-qa

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/overnight-e2e-qa
      - name: Preserve canonical Visit selection after refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/mobile/employee/page.tsx')
          source = path.read_text()
          old = 'setSelectedId(current=>current&&rows.some(row=>row.id===current)?current:(rows[0]?.id||""));'
          new = 'setSelectedId(current=>current&&rows.some(row=>row.id===current||row.canonicalVisitId===current)?current:(rows[0]?.id||""));'
          if old not in source:
              raise SystemExit('Verified selection guard was not found; refusing speculative edit.')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit verified repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-e2e-selection-fix.yml
          git add app/mobile/employee/page.tsx
          git commit -m "fix: preserve canonical visit selection after refresh"
          git push origin HEAD:agent/overnight-e2e-qa
