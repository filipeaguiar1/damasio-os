name: Canonical route move reindex V3

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - .github/workflows/agent-route-move-reindex-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch Move controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/admin/RouteStudio.tsx")
          source = path.read_text()
          old = ".route-move-mode button{display:grid;gap:4px;padding:14px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(255,255,255,.08);color:#fff;text-align:left;cursor:pointer}.route-move-mode button.active{border-color:#9ce3b9;background:rgba(156,227,185,.18)}.route-move-mode strong,.route-move-mode small{display:block}.route-move-mode small{color:rgba(255,255,255,.65)}"
          new = ".route-move-mode button{display:grid;gap:4px;padding:14px;border:1px solid #d7e7de;border-radius:14px;background:#f5fbf7;color:#0b3b2d;text-align:left;cursor:pointer;box-shadow:0 8px 22px rgba(3,48,31,.08);transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}.route-move-mode button:hover{transform:translateY(-1px);border-color:#b8d8c5;box-shadow:0 12px 28px rgba(3,48,31,.12)}.route-move-mode button.active{border-color:#fff;background:#fff;box-shadow:0 0 0 2px #9ce3b9,0 14px 30px rgba(3,48,31,.16)}.route-move-mode strong,.route-move-mode small{display:block}.route-move-mode small{color:#587267}.route-move-summary>.btn{background:#f8fff9!important;color:#075a3d!important;border:1px solid #d6ebdd!important;box-shadow:0 12px 28px rgba(2,44,29,.16)!important}.route-move-summary>.btn:hover{background:#fff!important;transform:translateY(-1px)}.route-move-summary>.btn:disabled{background:#edf7f0!important;color:#5f7c6e!important;border-color:#d8e8df!important;opacity:1!important;box-shadow:none!important}"
          if old not in source:
              raise SystemExit("Route Move CSS anchor not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Verify real source changes
        shell: bash
        run: |
          git diff --check
          git diff --exit-code --quiet && { echo "No RouteStudio change was applied"; exit 1; } || true
          grep -q 'background:#f8fff9!important' components/admin/RouteStudio.tsx
          node scripts/validate-route-move-reindex.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm check && pnpm build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/agent-route-move-reindex-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/admin/RouteStudio.tsx .github/workflows/agent-route-move-reindex-v3.yml
          git commit -m "Polish route move controls"
          git push origin HEAD:feature/25-30-homes-simulator-v1
