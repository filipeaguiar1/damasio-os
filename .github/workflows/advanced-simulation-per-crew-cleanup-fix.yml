name: Advanced Simulation Per-Crew Cleanup Fix

on:
  push:
    branches:
      - feature/advanced-simulation-foundation-20260808
    paths:
      - .github/workflows/advanced-simulation-per-crew-cleanup-fix.yml

permissions:
  contents: write

concurrency:
  group: damasio-advanced-simulation-per-crew-cleanup-fix
  cancel-in-progress: false

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/advanced-simulation-foundation-20260808
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Patch Route cleanup to one Crew per RPC
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/simulator/advancedSimulationData.ts')
          text = path.read_text()
          old = '''  let routesRemoved = 0;
          if (visitsDeleted && crewIds.length) {
            const cleanupRoutes = await service.rpc("cleanup_operational_simulation_routes", {
              p_company_id: scope.companyId,
              p_namespace: scope.namespace,
              p_crew_ids: crewIds,
            });
            if (cleanupRoutes.error) {
              throw new Error(`routes cleanup: ${cleanupRoutes.error.message || "protected QA Route cleanup failed"}`);
            }
            routesRemoved = Number(cleanupRoutes.data?.routeCount || 0);
          }
          '''
          new = '''  let routesRemoved = 0;
          if (visitsDeleted && crewIds.length) {
            // Keep each protected Route cleanup below the database statement timeout.
            // One simulation Crew owns about 47 Routes in the 12-month scale gate.
            for (const crewId of crewIds) {
              const cleanupRoutes = await service.rpc("cleanup_operational_simulation_routes", {
                p_company_id: scope.companyId,
                p_namespace: scope.namespace,
                p_crew_ids: [crewId],
              });
              if (cleanupRoutes.error) {
                throw new Error(`routes cleanup: ${cleanupRoutes.error.message || "protected QA Route cleanup failed"}`);
              }
              routesRemoved += Number(cleanupRoutes.data?.routeCount || 0);
            }
          }
          '''
          if old not in text:
              raise SystemExit('expected Route cleanup block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: |
          pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Validate production build
        run: pnpm build

      - name: Start production server
        run: |
          pnpm start > /tmp/damasio-advanced-per-crew.log 2>&1 &
          echo $! > /tmp/damasio-advanced-per-crew.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/damasio-advanced-per-crew.log
          exit 1

      - name: Run 4,620-service zero-residue gate
        run: pnpm exec playwright test tests/advanced-operational-simulator-large.spec.ts --reporter=line --workers=1

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/advanced-simulation-per-crew-cleanup-fix.yml
          git diff --check
          git config user.name "Damasio Simulation QA"
          git config user.email "actions@users.noreply.github.com"
          git add lib/simulator/advancedSimulationData.ts .github/workflows/advanced-simulation-per-crew-cleanup-fix.yml
          git commit -m "Make advanced simulation Route cleanup timeout-safe"
          git push origin HEAD:feature/advanced-simulation-foundation-20260808

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-simulation-per-crew-cleanup-fix
          path: /tmp/damasio-advanced-per-crew.log
          if-no-files-found: ignore
