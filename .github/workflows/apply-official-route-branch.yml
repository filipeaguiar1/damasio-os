name: Apply Final Route Stability Patch

on:
  push:
    branches: [feature/25-30-homes-simulator-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply prepared stability patch
        run: python scripts/apply-final-ui-network-stability.py
      - name: Restore workflow and remove staging script
        shell: bash
        run: |
          git show HEAD^:.github/workflows/apply-official-route-branch.yml > .github/workflows/apply-official-route-branch.yml
          rm scripts/apply-final-ui-network-stability.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/employee/route/page.tsx components/admin/OfficialRoutePlanMap.tsx tests/canonical-route-sync.spec.ts scripts/apply-final-ui-network-stability.py .github/workflows/apply-official-route-branch.yml
          git commit -m "fix: finalize canonical route status and fetch resilience"
          git push origin HEAD:feature/25-30-homes-simulator-v1
