name: Apply Official Route Branch

on:
  push:
    branches: [work/official-route-map-no-demo]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'work/official-route-map-no-demo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/official-route-map-no-demo
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply prepared patch
        shell: bash
        run: |
          python scripts/apply-official-route-patch.py
          python scripts/fix-official-route-typecheck.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/official-route-typecheck.log 2>&1
          status=$?
          cat /tmp/official-route-typecheck.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/official-route-typecheck.log docs/OFFICIAL_ROUTE_TYPECHECK_ERROR.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app components lib docs/OFFICIAL_ROUTE_TYPECHECK_ERROR.txt
            git commit -m "Record official route typecheck failure"
            git push origin HEAD:work/official-route-map-no-demo
            exit "$status"
          fi
      - name: Production build
        run: pnpm build
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f docs/OFFICIAL_ROUTE_PATCH_ERROR.txt docs/OFFICIAL_ROUTE_TYPECHECK_ERROR.txt
          git add app components lib docs/OFFICIAL_ROUTE_PATCH_ERROR.txt docs/OFFICIAL_ROUTE_TYPECHECK_ERROR.txt
          git commit -m "Complete official route maps and visit status colors"
          git push origin HEAD:work/official-route-map-no-demo
