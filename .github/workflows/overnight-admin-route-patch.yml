name: Overnight admin route patch

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - scripts/overnight-admin-route-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/overnight-admin-route-patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mobile/admin/routes/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(routes): correct admin mobile empty state"
          git push
