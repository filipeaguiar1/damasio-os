name: Temporary Fix Canonical Route Admin Email Locator

on:
  push:
    branches:
      - monthly-billing-payment-health-20260823

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monthly-billing-payment-health-20260823
          fetch-depth: 0
      - name: Make remaining email locator unambiguous
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/canonical-route-sync.spec.ts')
          text = path.read_text()
          old = 'adminDesktop.getByLabel("Email")'
          if old not in text:
              raise SystemExit('Expected Admin Email locator was not found')
          text = text.replace(old, 'adminDesktop.getByRole("textbox", { name: "Email" })', 1)
          path.write_text(text)
          PY
          git rm -f .github/workflows/temp-fix-canonical-route-admin-email-locator.yml
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/canonical-route-sync.spec.ts
          git commit -m "Fix canonical route admin email locator"
          git push origin HEAD:monthly-billing-payment-health-20260823
