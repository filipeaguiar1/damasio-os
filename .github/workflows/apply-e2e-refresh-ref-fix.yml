name: Apply current Employee refresh callback

on:
  push:
    branches:
      - agent/overnight-e2e-qa

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/overnight-e2e-qa
      - name: Keep sync listeners on the current refresh callback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/mobile/employee/page.tsx")
          text = path.read_text()
          marker = '  async function syncOfflineQueue(){'
          ref_block = '  const refreshRef=useRef(refresh);\n  refreshRef.current=refresh;\n\n'
          if 'const refreshRef=useRef(refresh);' not in text:
              if marker not in text:
                  raise SystemExit('refresh ref insertion point not found')
              text = text.replace(marker, ref_block + marker, 1)
          old = 'const on=()=>refresh();'
          new = 'const on=()=>refreshRef.current();'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('sync listener callback not found')
          path.write_text(text)
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mobile/employee/page.tsx
          git commit -m "fix: keep employee sync refresh callback current"
          git push origin HEAD:agent/overnight-e2e-qa
