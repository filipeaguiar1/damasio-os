name: Operational Simulator Engine

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
  pull_request:
    branches:
      - main
    paths:
      - "lib/simulator/**"
      - "scripts/validate-operational-simulator.mjs"
      - ".github/workflows/operational-simulator-engine.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-operational-simulator.mjs
