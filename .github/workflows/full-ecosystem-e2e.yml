name: Full Ecosystem E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "tests/full-ecosystem*.spec.ts"
      - ".github/workflows/full-ecosystem-e2e.yml"
      - "app/api/master/**"
      - "app/api/admin/**"
      - "app/api/mobile/**"
      - "app/api/customer/**"
      - "app/api/stripe/**"
      - "lib/routes/verifyCanonicalRoutePersistence.ts"
      - "supabase/migrations/202608071610_route_stops_visit_projection.sql"

permissions:
  contents: read

# This named PR check is intentionally non-mutating. Authenticated Full Ecosystem
# journeys run at the end of Operational Simulator E2E, the single heavy writer
# for the shared QA database.
concurrency:
  group: damasio-full-ecosystem-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate ecosystem architecture and production build
        run: pnpm build
