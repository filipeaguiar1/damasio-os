name: Full Ecosystem E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "tests/full-ecosystem*.spec.ts"
      - ".github/workflows/full-ecosystem-e2e.yml"
      - "app/api/master/**"
      - "app/api/admin/**"
      - "app/api/mobile/**"
      - "app/api/customer/**"
      - "app/api/stripe/**"
      - "lib/routes/verifyCanonicalRoutePersistence.ts"
      - "supabase/migrations/202608071610_route_stops_visit_projection.sql"

permissions:
  contents: read

concurrency:
  group: full-ecosystem-e2e
  cancel-in-progress: true

jobs:
  ecosystem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install temporary Playwright package
        run: pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0
      - name: TypeScript and production build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        run: |
          pnpm start > /tmp/damasio-full-ecosystem.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/damasio-full-ecosystem.log
          exit 1
      - name: Run full ecosystem journeys
        run: pnpm exec playwright test tests/full-ecosystem.spec.ts tests/full-ecosystem-smart-route.spec.ts tests/full-ecosystem-stripe.spec.ts --reporter=line --workers=1
      - name: Upload ecosystem evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ecosystem-e2e
          path: |
            /tmp/damasio-full-ecosystem.log
            test-results/**
          if-no-files-found: ignore
