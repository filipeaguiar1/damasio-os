name: Manager canonical map read hardening

on:
  push:
    branches:
      - audit/manager-permission-enforcement-20260809
    paths:
      - .github/workflows/manager-map-read-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/manager-permission-enforcement-20260809
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Patch Manager canonical map read
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('app/api/map/canonical-route/route.ts')
          text=path.read_text()
          old='import type { RouteLineString } from "@/lib/maps/types";\n'
          new='import type { RouteLineString } from "@/lib/maps/types";\nimport { hasManagerPermission } from "@/lib/auth/managerPermissions";\n'
          if old not in text: raise SystemExit('map import anchor missing')
          text=text.replace(old,new,1)
          old='.select("id,role,active,company_id,organization_id,full_name,address_line1,route_start_address")'
          new='.select("id,role,active,company_id,organization_id,full_name,address_line1,route_start_address,manager_permissions")'
          if old not in text: raise SystemExit('map profile select anchor missing')
          text=text.replace(old,new,1)
          old='''  if (!profile?.active) throw new Error("This account is not active.");\n  const companyId = profile.company_id || profile.organization_id;'''
          new='''  if (!profile?.active) throw new Error("This account is not active.");\n  if (String(profile.role) === "manager" && !hasManagerPermission(profile.manager_permissions, "routes", "view")) {\n    throw new Error("Manager Routes view permission is required.");\n  }\n  const companyId = profile.company_id || profile.organization_id;'''
          if old not in text: raise SystemExit('map role anchor missing')
          text=text.replace(old,new,1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm check && pnpm build

      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/manager-map-read-hardening.yml
          git diff --check
          grep -q 'Manager Routes view permission' app/api/map/canonical-route/route.ts
          git config user.name "Damasio Security QA"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/map/canonical-route/route.ts .github/workflows/manager-map-read-hardening.yml
          git commit -m "Enforce Manager permission on canonical map reads"
          git push origin HEAD:audit/manager-permission-enforcement-20260809
