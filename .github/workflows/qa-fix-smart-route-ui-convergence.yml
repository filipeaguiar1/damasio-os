name: QA fix Smart Route UI convergence

on:
  push:
    branches:
      - qa/full-ecosystem-e2e-20260807
    paths:
      - .github/workflows/qa-fix-smart-route-ui-convergence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Patch Smart Route UI convergence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/mobile/employee/page.tsx')
          text = path.read_text()
          old = '''      const nextContext=await loadEmployeeRouteMapContext(selectedDate,crew);\n      setMapContext(nextContext);\n      const state=await loadEmployeeDatabaseSmartRouteState(mapContext.routeId);\n      setActiveSmartState(state);setSmartRouteActive(Boolean(state?.active));\n      setSmartPreview([]);refresh();setHomeMode("route");setRouteView("map");setMessage("Smart Route applied. Admin and Employee now share the same published order.");'''
          new = '''      const nextContext=await loadEmployeeRouteMapContext(selectedDate,crew);\n      setMapContext(nextContext);\n      setSmartPreview([]);setHomeMode("route");setRouteView("map");refresh();setMessage("Smart Route applied. Admin and Employee now share the same published order.");\n      // The canonical Route is already saved and visible. Secondary Smart Route state\n      // must never hold the field UI on a stale preview while other screens advance.\n      void loadEmployeeDatabaseSmartRouteState(mapContext.routeId).then(state=>{\n        setActiveSmartState(state);setSmartRouteActive(Boolean(state?.active));\n      }).catch(()=>{\n        // Realtime/route snapshot remains authoritative; state can retry on the normal refresh cycle.\n      });'''
          if old not in text:
              raise SystemExit('Smart Route convergence anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          pnpm test:route-writers
          pnpm test:map-sync
          pnpm typecheck
      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/qa-fix-smart-route-ui-convergence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mobile/employee/page.tsx .github/workflows/qa-fix-smart-route-ui-convergence.yml
          git commit -m "Show canonical Smart Route before secondary state refresh"
          git push origin HEAD:qa/full-ecosystem-e2e-20260807
