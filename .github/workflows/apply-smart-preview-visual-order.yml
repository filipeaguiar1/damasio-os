name: Apply Smart Preview Visual Order

on:
  push:
    branches: [fix/smart-preview-visual-order]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-preview-visual-order
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: python scripts/patch-smart-preview-visual-order.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-smart-preview-visual-order.py docs/SMART_PREVIEW_VISUAL_TRIGGER.txt .github/workflows/apply-smart-preview-visual-order.yml
          git add app components scripts docs .github
          git commit -m "Render and apply the actual Smart Route sequence"
          git push origin HEAD:fix/smart-preview-visual-order
