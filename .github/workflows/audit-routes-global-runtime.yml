name: Audit Routes Global Runtime

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - .github/workflows/audit-routes-global-runtime.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Start branch production server
        run: |
          pnpm start > /tmp/routes-global-runtime.log 2>&1 &
          echo $! > /tmp/routes-global-runtime.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/routes-global-runtime.log
          exit 1
      - name: Authenticate QA Admin
        run: |
          node --input-type=module <<'NODE' > /tmp/admin-token
          import { createClient } from '@supabase/supabase-js';
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;
          const email = process.env.E2E_ADMIN_EMAIL;
          const password = process.env.E2E_ADMIN_PASSWORD;
          if (!url || !key || !email || !password) throw new Error('Required E2E auth secret is missing.');
          const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } });
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error || !data.session?.access_token) throw new Error(error?.message || 'Admin auth failed.');
          process.stdout.write(data.session.access_token);
          NODE
      - name: Execute routes-global read paths
        run: |
          TOKEN="$(cat /tmp/admin-token)"
          TODAY="$(date +%F)"
          run_check() {
            local label="$1"
            local url="$2"
            local output="/tmp/${label}.json"
            local metrics
            metrics="$(curl --silent --show-error --max-time 15 \
              -H "Authorization: Bearer ${TOKEN}" \
              -o "${output}" \
              -w '%{http_code} %{time_total}' \
              "${url}")"
            read -r code seconds <<<"${metrics}"
            echo "${label}: status=${code} seconds=${seconds}"
            test "${code}" -ge 200 -a "${code}" -lt 300
            node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!p || !Array.isArray(p.employees) || !p.board) process.exit(1)' "${output}"
          }
          run_check dated "http://127.0.0.1:3000/api/admin/routes-global?date=${TODAY}"
          run_check bounded "http://127.0.0.1:3000/api/admin/routes-global"
      - name: Assert GET did not log route mutation errors
        run: |
          if grep -E 'statement timeout|admin-routes-get.*(insert|update)|canceling statement' /tmp/routes-global-runtime.log; then
            cat /tmp/routes-global-runtime.log
            exit 1
          fi
      - name: Remove temporary runtime gate
        run: |
          rm .github/workflows/audit-routes-global-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-routes-global-runtime.yml
          git commit -m "chore(audit): remove routes-global runtime gate"
          git push origin HEAD:feature/25-30-homes-simulator-v1
