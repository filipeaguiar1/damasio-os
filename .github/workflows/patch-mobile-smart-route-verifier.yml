name: Patch mobile Smart Route verifier

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - ".github/workflows/patch-mobile-smart-route-verifier.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch canonical mobile verification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/api/mobile/employee/smart-route/route.ts")
          source = path.read_text()

          import_line = 'import { verifyCanonicalRoutePersistence } from "@/lib/routes/verifyCanonicalRoutePersistence";'
          if import_line not in source:
              source = source.replace(
                  'import { createClient } from "@supabase/supabase-js";\n',
                  'import { createClient } from "@supabase/supabase-js";\n'
                  f'{import_line}\n',
                  1,
              )

          verifier_start = source.index('function sameOrder(')
          post_start = source.index('export async function POST', verifier_start)
          source = source[:verifier_start] + source[post_start:]

          rpc_start = source.index(
              '    const { data, error } = await service.rpc("apply_canonical_route_order_v2_service", {'
          )
          rpc_end = source.index('    });', rpc_start) + len('    });')
          new_rpc = '''    const origin = body.origin;
            if (
              !origin
              || !origin.label
              || !Number.isFinite(origin.latitude)
              || !Number.isFinite(origin.longitude)
            ) {
              throw new Error("A valid canonical Route origin is required.");
            }

            console.info("employee-smart-route-v2-request", {
              routeId: body.routeId,
              expectedVersion: body.expectedVersion ?? null,
              orderedVisitIds: requestedOrder,
              origin,
            });

            const { data, error } = await service.rpc("apply_canonical_route_order_v2_service", {
              p_route_id: body.routeId,
              p_ordered_visit_ids: requestedOrder,
              p_origin_label: origin.label,
              p_origin_latitude: origin.latitude,
              p_origin_longitude: origin.longitude,
              p_expected_version: body.expectedVersion ?? null,
              p_actor_profile_id: profileId,
              p_source: "employee_smart_route",
            });'''
          source = source[:rpc_start] + new_rpc + source[rpc_end:]

          readback_start = source.index('    const verified = await verifyOfficialRouteOrder(')
          response_end = source.index('    };', readback_start) + len('    };')
          new_readback = '''    const routeVersion = Number(result.version || 0);
            if (!Number.isInteger(routeVersion) || routeVersion < 1) {
              throw new Error("The database did not confirm a canonical routeVersion.");
            }

            const verified = await verifyCanonicalRoutePersistence(service, {
              routeId: body.routeId,
              orderedVisitIds: requestedOrder,
              routeVersion,
              origin,
            });
            const response = {
              ...result,
              version: verified.routeVersion,
              routeVersion: verified.routeVersion,
              appliedOrder: verified.orderedVisitIds,
              orderedVisitIds: verified.orderedVisitIds,
              origin: verified.origin,
            };'''
          source = source[:readback_start] + new_readback + source[response_end:]

          log_marker = '      appliedOrder: response.appliedOrder,\n'
          if log_marker not in source:
              raise SystemExit("Mobile success log marker was not found.")
          source = source.replace(
              log_marker,
              log_marker + '      origin: response.origin,\n',
              1,
          )

          path.write_text(source)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-mobile-smart-route-verifier.yml
          git add app/api/mobile/employee/smart-route/route.ts
          git commit -m "fix(routes): verify mobile Smart Route after stable reread"
          git push
