name: QA Smart Route rollout compatibility

on:
  push:
    branches:
      - qa/full-ecosystem-e2e-20260807
    paths:
      - .github/workflows/agent-smart-route-rollout-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply patch
        run: python scripts/qa-smart-route-rollout-patch.py
      - name: Validate architecture and types
        run: |
          pnpm install --frozen-lockfile
          pnpm test:route-writers
          pnpm test:map-sync
          pnpm typecheck
      - name: Commit verified fix
        run: |
          rm .github/workflows/agent-smart-route-rollout-compat.yml
          rm scripts/qa-smart-route-rollout-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep Smart Route canonical during projection rollout"
          git push origin HEAD:qa/full-ecosystem-e2e-20260807
