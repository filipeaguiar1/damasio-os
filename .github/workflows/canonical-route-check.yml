name: Apply Four-Screen Session Validation Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-four-screen-session-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/25-30-homes-simulator-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply four-screen session patch
        run: python scripts/fix-canonical-four-screen-session.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated change
        run: |
          git config user.name "Damasio OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/canonical-route-sync.spec.ts
          git commit -m "test(routes): validate Employee web and mobile in one session"
          git push origin HEAD:feature/25-30-homes-simulator-v1
