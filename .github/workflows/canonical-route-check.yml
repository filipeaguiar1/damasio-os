name: Canonical Route Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-route-final-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - name: Apply final route E2E fixes
        run: python scripts/apply-final-e2e-route-fixes.py

      - name: Publish code and test fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/operational-simulator/route.ts app/api/map/canonical-route/route.ts tests/operational-simulator.spec.ts
          git commit -m "fix(routes): guarantee drawable geometry and deterministic cleanup"
          git push origin HEAD:feature/25-30-homes-simulator-v1
