name: Canonical Route Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-route-final-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - name: Apply final route selection and status fixes
        run: python scripts/apply-final-route-selection-status-fixes.py

      - name: Publish code and test fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/mobile/employee/route/route.ts components/admin/OfficialRoutePlanMap.tsx tests/canonical-route-sync.spec.ts
          git commit -m "fix(routes): expose reliable Admin selection and canonical Visit updates"
          git push origin HEAD:feature/25-30-homes-simulator-v1
