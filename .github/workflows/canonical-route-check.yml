name: Apply Employee Canonical Web View Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-employee-canonical-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/25-30-homes-simulator-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply Employee canonical web view fix
        run: python scripts/fix-employee-web-canonical-view.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated change
        run: |
          git config user.name "Damasio OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/employee/route/page.tsx tests/canonical-route-sync.spec.ts
          git commit -m "fix(routes): bind Employee web map to canonical route date"
          git push origin HEAD:feature/25-30-homes-simulator-v1
