name: Canonical Route Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canonical-route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate canonical route identity
        run: node scripts/validate-canonical-route.mjs

      - name: Validate Canonical Route Stops V2
        run: node scripts/validate-route-stops-v2.mjs

      - name: Simulate canonical operations
        run: node scripts/simulate-canonical-operations.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
