name: Canonical Route Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-status-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - name: Apply canonical status convergence
        run: python scripts/apply-canonical-status-convergence.py

      - name: Publish code and test fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/routeMapService.ts app/employee/route/page.tsx app/mobile/employee/page.tsx tests/canonical-route-sync.spec.ts lib/services/employeeVisitStatusService.ts
          git commit -m "fix(routes): wait for canonical status convergence"
          git push origin HEAD:feature/25-30-homes-simulator-v1
