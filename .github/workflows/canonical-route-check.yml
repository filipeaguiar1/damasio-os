name: Apply Employee Browser Bootstrap Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-employee-browser-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/25-30-homes-simulator-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply Employee browser bootstrap fix
        run: python scripts/fix-employee-browser-bootstrap.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated change
        run: |
          git config user.name "Damasio OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib/routes/canonicalRouteSnapshot.ts lib/services/employeeIdentityService.ts app/api/mobile/employee/bootstrap/route.ts
          git commit -m "fix(routes): bootstrap Employee web from canonical session"
          git push origin HEAD:feature/25-30-homes-simulator-v1
