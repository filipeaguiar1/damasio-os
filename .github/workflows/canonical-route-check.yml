name: Canonical Route Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-route-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - name: Apply staged repair
        run: python scripts/apply-route-soft-cleanup.py

      - name: Publish code repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/operational-simulator/route.ts app/api/admin/routes/route.ts tests/operational-simulator.spec.ts tests/canonical-route-sync.spec.ts
          git commit -m "fix(simulator): archive legacy rows when protected deletes are unavailable"
          git push origin HEAD:feature/25-30-homes-simulator-v1
