name: Consolidated UI polish

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply patch
        run: python3 scripts/apply-consolidated-ui-polish.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          pnpm check
          pnpm build
      - name: Commit final batch
        run: |
          rm -f .github/workflows/agent-ui-polish-batch.yml scripts/apply-consolidated-ui-polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/admin/AdminShell.tsx "app/admin/customers/[id]/page.tsx" app/globals.css .github/workflows/agent-ui-polish-batch.yml scripts/apply-consolidated-ui-polish.py
          git commit -m "Polish admin navigation and property profile UI"
          git push origin HEAD:feature/25-30-homes-simulator-v1
