name: Remove Smart Route capacity limits

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - .github/workflows/agent-remove-smart-route-capacity-limits.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply capacity changes
        run: python scripts/patch-smart-route-capacity.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm check

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/agent-remove-smart-route-capacity-limits.yml
          rm scripts/patch-smart-route-capacity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            app/api/mobile/employee/smart-route/route.ts \
            app/api/admin/users/route.ts \
            app/admin/employees/page.tsx \
            app/mobile/admin/employees/page.tsx \
            supabase/migrations/202608050200_remove_employee_capacity_ceiling.sql \
            scripts/validate-smart-route-capacity.mjs \
            scripts/patch-smart-route-capacity.py \
            docs/checkpoints/2026-08-05-smart-route-canonical-stable.md \
            package.json \
            .github/workflows/agent-remove-smart-route-capacity-limits.yml
          git commit -m "Remove fixed Smart Route capacity limits"
          git push origin HEAD:feature/25-30-homes-simulator-v1
