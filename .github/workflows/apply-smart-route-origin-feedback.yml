name: Apply Smart Route Origin Feedback

on:
  push:
    branches: [fix/smart-route-origin-feedback]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-route-origin-feedback
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply patch
        run: python scripts/patch-smart-route-origin-feedback.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm typecheck && pnpm build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-smart-route-origin-feedback.py .github/workflows/apply-smart-route-origin-feedback.yml docs/SMART_ROUTE_ORIGIN_TRIGGER.txt
          git add app lib scripts .github docs
          git commit -m "Fix Smart Route origin and recalculation feedback"
          git push origin HEAD:fix/smart-route-origin-feedback
