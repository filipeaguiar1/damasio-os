name: Fix Route Advisor Last Write Wins

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - .github/workflows/fix-route-advisor-last-write-wins.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - name: Remove legacy Route Advisor writes
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path("app/api/admin/route-advisor/route.ts")
          source = route_path.read_text()
          start_marker = "async function materializePublishedRoute(input: {"
          end_marker = "\nexport async function POST(request: NextRequest) {"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Route Advisor materialization block was not found exactly once.")

          replacement = '''async function materializePublishedRoute(input: {
            service: any;
            companyId: string;
            routeId: string;
            routeDate: string;
            employeeId: string;
            crewId: string;
            orderedJobIds: string[];
          }) {
            const { service, companyId, routeId, routeDate, employeeId, crewId, orderedJobIds } = input;
            if (!routeId) throw new Error("Publication returned no canonical routeId.");

            const visitsResult = await service
              .from("visits")
              .select("id,job_id,route_id,route_order,status,assigned_employee_id,crew_id,scheduled_date")
              .eq("route_id", routeId)
              .eq("scheduled_date", routeDate)
              .neq("status", "cancelled")
              .or(companyFilter(companyId))
              .order("route_order", { ascending: true });
            if (visitsResult.error) throw new Error(visitsResult.error.message);

            const visits = visitsResult.data || [];
            if (visits.length !== orderedJobIds.length) {
              throw new Error(`Published Route verification failed: expected ${orderedJobIds.length} Visits, received ${visits.length}.`);
            }

            const byJob = new Map(visits.map((visit: any) => [String(visit.job_id || ""), visit]));
            const orderedVisits = orderedJobIds.map(jobId => {
              const visit: any = byJob.get(jobId);
              if (!visit) throw new Error(`Published Route is missing the Visit for Job ${jobId}.`);
              if (String(visit.assigned_employee_id || "") !== employeeId
                || String(visit.crew_id || "") !== crewId
                || String(visit.route_id || "") !== routeId
                || String(visit.scheduled_date || "") !== routeDate) {
                throw new Error("Published Route identity verification failed.");
              }
              return visit;
            });

            // Do not write visits.route_order, route_stops or route_order_state here.
            // The protected canonical RPC replaces the full order atomically below.
            return {
              orderedVisitIds: orderedVisits.map((visit: any) => String(visit.id)),
              count: orderedVisits.length,
            };
          }
          '''

          updated = source[:start] + replacement + source[end:]
          old_expected = "      p_expected_version: canonical.routeVersion,"
          new_expected = "      p_expected_version: null, // Admin publication is intentionally last-write-wins."
          if updated.count(old_expected) != 1:
              raise SystemExit("Expected the Route Advisor version-gated apply exactly once.")
          updated = updated.replace(old_expected, new_expected, 1)
          route_path.write_text(updated)

          validation = '''import assert from "node:assert/strict";
          import fs from "node:fs";

          const route = fs.readFileSync("app/api/admin/route-advisor/route.ts", "utf8");
          const migration = fs.readFileSync("supabase/migrations/202608031100_lock_active_canonical_route_order.sql", "utf8");
          const materializeStart = route.indexOf("async function materializePublishedRoute");
          const materializeEnd = route.indexOf("export async function POST", materializeStart);
          assert.ok(materializeStart >= 0 && materializeEnd > materializeStart, "Route materialization helper must exist.");
          const materialize = route.slice(materializeStart, materializeEnd);

          assert.doesNotMatch(materialize, /from\("route_stops"\)/, "Route Advisor must not directly rewrite protected route_stops.");
          assert.doesNotMatch(materialize, /from\("route_order_state"\)/, "Route Advisor must not pre-increment canonical route state.");
          assert.doesNotMatch(materialize, /from\("visits"\)\s*\.update/, "Route Advisor must not maintain a parallel Visit order writer.");
          assert.match(route, /service\.rpc\("apply_canonical_route_order_v2_service"/, "Route Advisor must finish through the protected canonical writer.");
          assert.match(route, /p_expected_version:\s*null/, "Admin publication must use intentional last-write-wins semantics.");
          assert.match(migration, /set_config\('damasio\.canonical_route_write',\s*'1',\s*true\)/, "The canonical writer must keep its transaction-local authorization.");
          assert.match(migration, /where id = p_route_id\s+for update/, "The canonical writer must serialize competing publications on the Route row.");

          console.log("PASS Route Advisor replaces the canonical route atomically; the latest Admin publication wins");
          '''
          Path("scripts/validate-route-advisor-last-write-wins.mjs").write_text(validation)
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical replacement and build
        run: node scripts/validate-route-advisor-last-write-wins.mjs && pnpm check && pnpm build

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-route-advisor-last-write-wins.yml
          git add app/api/admin/route-advisor/route.ts scripts/validate-route-advisor-last-write-wins.mjs
          git commit -m "Allow Route Advisor to replace canonical route"
          git push origin HEAD:feature/25-30-homes-simulator-v1
