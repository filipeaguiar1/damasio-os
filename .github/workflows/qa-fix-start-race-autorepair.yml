name: Visit Start Race Autorepair

on:
  push:
    branches:
      - fix/start-race-autorepair-20260808

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/start-race-autorepair-20260808
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply Start race autorepair
        run: python scripts/qa-fix-start-race-autorepair.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Persist validated fix
        shell: bash
        run: |
          git config user.name "Damasio QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/mobile/employee/route/route.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Start race autorepair already applied."
            exit 0
          fi
          git commit -m "Fix Employee Visit Start race and partial state"
          git push origin HEAD:fix/start-race-autorepair-20260808
