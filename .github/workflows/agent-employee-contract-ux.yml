name: Employee contract UX

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - .github/workflows/agent-employee-contract-ux.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply Employee contract UX patch
        run: python scripts/patch-employee-contract-ux.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm check
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/agent-employee-contract-ux.yml
          rm scripts/patch-employee-contract-ux.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            app/admin/employees/page.tsx \
            components/admin/AdminShell.tsx \
            scripts/validate-employee-contract-ux.mjs \
            scripts/patch-employee-contract-ux.py \
            package.json \
            .github/workflows/agent-employee-contract-ux.yml
          git commit -m "Improve Employee contract navigation"
          git push origin HEAD:feature/25-30-homes-simulator-v1
