name: Build 4Ever Seasons APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android-employee-test/**"
      - "assets/mobile-opening/**"
      - "scripts/materialize-mobile-opening.mjs"
      - ".github/workflows/build-employee-apk.yml"
  push:
    branches: [main]
    paths:
      - "android-employee-test/**"
      - "assets/mobile-opening/**"
      - "scripts/materialize-mobile-opening.mjs"
      - ".github/workflows/build-employee-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable QA signing key
        run: base64 -d android-employee-test/test-signing.keystore.b64 > android-employee-test/test-signing.keystore

      # Temporary build-time fallback only. The approved 52.2.4 video is
      # injected byte-for-byte during finalization of the installable APK.
      - name: Prepare opening asset for build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-mobile-opening.mjs
          mkdir -p android-employee-test/app/src/main/assets
          cp public/brand/4ever-seasons-opening-native-cache-v2.mp4 android-employee-test/app/src/main/assets/opening_default.mp4
          test "$(stat -c%s android-employee-test/app/src/main/assets/opening_default.mp4)" -ge 100000

      - name: Verify restored launcher configuration
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android-employee-test/app/src/main/AndroidManifest.xml"
          test -f android-employee-test/app/src/main/res/drawable/ic_app_logo_premium.jpg
          grep -q 'android:name=".LauncherDefault"' "$MANIFEST"
          grep -q 'android:enabled="true"' "$MANIFEST"
          grep -q 'android:icon="@drawable/ic_app_logo_premium"' "$MANIFEST"
          grep -q 'android:roundIcon="@drawable/ic_app_logo_premium"' "$MANIFEST"

      - name: Build base and unsigned APKs
        run: gradle -p android-employee-test :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Verify package is ready for exact asset finalization
        shell: bash
        run: |
          set -euo pipefail
          APK="android-employee-test/app/build/outputs/apk/release/app-release-unsigned.apk"
          unzip -l "$APK" > /tmp/apk-contents.txt
          grep -q "assets/opening_default.mp4" /tmp/apk-contents.txt
          echo "Unsigned APK is ready for exact approved asset injection."

      - name: Prepare base APK
        run: cp android-employee-test/app/build/outputs/apk/debug/app-debug.apk 4ever-seasons-mobile-v52.3.6-base.apk

      - name: Prepare local finalization kit
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p apk-buildkit/lib
          cp android-employee-test/app/build/outputs/apk/release/app-release-unsigned.apk apk-buildkit/4ever-seasons-mobile-v52.3.6-unsigned.apk
          cp "$BT/apksigner" apk-buildkit/apksigner
          cp "$BT/zipalign" apk-buildkit/zipalign
          cp "$BT/lib/apksigner.jar" apk-buildkit/lib/apksigner.jar
          cp android-employee-test/test-signing.keystore apk-buildkit/test-signing.keystore
          chmod +x apk-buildkit/apksigner apk-buildkit/zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: 4ever-seasons-mobile-v52.3.6-base
          path: 4ever-seasons-mobile-v52.3.6-base.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: 4ever-seasons-mobile-v52.3.6-buildkit
          path: apk-buildkit/
          if-no-files-found: error
          retention-days: 2
