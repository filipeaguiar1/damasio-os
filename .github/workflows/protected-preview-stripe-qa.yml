name: Protected Preview Stripe QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/internal/preview-stripe-qa/**"
      - "app/api/stripe/**"
      - ".github/workflows/protected-preview-stripe-qa.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: protected-preview-stripe-qa
  cancel-in-progress: true

jobs:
  stripe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1

      - name: Create short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Run Stripe QA inside protected Vercel preview
        env:
          BASE_URL: https://damasio-os-h1mc-git-feature-25-30-homes-simulator-v1-damaio-os.vercel.app
          QA_TOKEN: preview-stripe-qa-20260729-4ever-seasons
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$BASE_URL/api/stripe/readiness" > readiness.json

          cat readiness.json
          deployed_sha=$(node -e "const value=require('./readiness.json');if(!value.commitSha)throw new Error('Missing deployed commit');if(value.mode!=='test')throw new Error('Stripe is not in test mode');if(!value.webhookConfigured)throw new Error('Webhook is not configured');process.stdout.write(value.commitSha)")
          echo "Testing protected preview commit $deployed_sha"

          curl --fail-with-body --silent --show-error \
            -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
            -H "x-vercel-set-bypass-cookie: true" \
            "$BASE_URL/api/internal/preview-stripe-qa?token=$QA_TOKEN&commit=$deployed_sha" \
            > stripe-qa-result.json

          cat stripe-qa-result.json
          node - <<'NODE'
          const result = require('./stripe-qa-result.json');
          if (!result.passed) throw new Error(result.error || 'Stripe QA did not pass.');
          if (result.stripeMode !== 'test') throw new Error('Stripe QA was not in test mode.');
          if (result.invoice?.status !== 'paid') throw new Error('QA invoice was not paid.');
          if (result.payment?.status !== 'paid') throw new Error('Canonical payment was not paid.');
          if (!result.webhook?.received) throw new Error('Signed webhook was not processed.');
          if (Number(result.wallet?.balanceCredits || 0) < 10) throw new Error('Wallet test credit was not added.');
          console.log('Protected preview Stripe QA passed.');
          NODE

      - name: Upload Stripe QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-preview-stripe-qa
          path: |
            readiness.json
            stripe-qa-result.json
          if-no-files-found: ignore
