name: Protected Preview Stripe QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/internal/preview-stripe-qa/**"
      - "app/api/stripe/readiness/**"
      - "supabase/migrations/202607300001_stripe_service_role_ledger_permissions.sql"
      - ".github/workflows/protected-preview-stripe-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-preview-stripe-qa
  cancel-in-progress: true

jobs:
  stripe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://damasio-os-h1mc-1yzjnz75w-damaio-os.vercel.app
      TARGET_COMMIT: af9cbb7c68af720830a871755802fdb9e1a4fd12
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DATABASE_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1

      - name: Validate protected preview configuration
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL is not configured in GitHub Actions secrets."
            exit 1
          fi
          management_token="${SUPABASE_ACCESS_TOKEN:-${SUPABASE_MANAGEMENT_ACCESS_TOKEN:-}}"
          database_password="${SUPABASE_DB_PASSWORD:-${SUPABASE_DATABASE_PASSWORD:-${DB_PASSWORD:-}}}"
          if [ -z "$management_token" ] && [ -z "$database_password" ]; then
            echo "No Supabase management token or database password is configured for the migration."
            exit 1
          fi

      - name: Apply trusted Stripe ledger permissions
        run: |
          set -euo pipefail
          management_token="${SUPABASE_ACCESS_TOKEN:-${SUPABASE_MANAGEMENT_ACCESS_TOKEN:-}}"
          database_password="${SUPABASE_DB_PASSWORD:-${SUPABASE_DATABASE_PASSWORD:-${DB_PASSWORD:-}}}"
          project_ref=$(python - <<'PY'
          import os
          import urllib.parse
          hostname = urllib.parse.urlparse(os.environ["NEXT_PUBLIC_SUPABASE_URL"]).hostname or ""
          print(hostname.split(".")[0])
          PY
          )
          if [ -z "$project_ref" ]; then
            echo "Could not resolve the Supabase project ref."
            exit 1
          fi

          if [ -n "$management_token" ]; then
            python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ.get("SUPABASE_ACCESS_TOKEN") or os.environ.get("SUPABASE_MANAGEMENT_ACCESS_TOKEN")
          hostname = urllib.parse.urlparse(os.environ["NEXT_PUBLIC_SUPABASE_URL"]).hostname or ""
          project_ref = hostname.split(".")[0]
          query = Path("supabase/migrations/202607300001_stripe_service_role_ledger_permissions.sql").read_text()
          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project_ref}/database/query",
              data=json.dumps({"query": query, "read_only": False}).encode(),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  print(f"Stripe ledger permission migration applied through Management API: HTTP {response.status}")
          except urllib.error.HTTPError as error:
              detail = error.read().decode(errors="replace")
              raise SystemExit(f"Stripe ledger permission migration failed: HTTP {error.code}: {detail[:1000]}")
          PY
          else
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y postgresql-client >/dev/null
            fi
            export PGPASSWORD="$database_password"
            psql \
              "host=db.${project_ref}.supabase.co port=5432 dbname=postgres user=postgres sslmode=require connect_timeout=20" \
              --set ON_ERROR_STOP=1 \
              --file supabase/migrations/202607300001_stripe_service_role_ledger_permissions.sql
            unset PGPASSWORD
            echo "Stripe ledger permission migration applied through the direct database connection."
          fi

      - name: Verify immutable Vercel preview
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error \
            --output /tmp/stripe-readiness.json \
            --write-out "%{http_code}" \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$BASE_URL/api/stripe/readiness")

          if [ "$status" != "200" ]; then
            echo "Protected preview readiness failed with HTTP $status."
            head -c 1000 /tmp/stripe-readiness.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync('/tmp/stripe-readiness.json', 'utf8'));
          if (value.commitSha !== process.env.TARGET_COMMIT) throw new Error('Immutable preview commit does not match the QA target.');
          if (value.branch !== 'feature/25-30-homes-simulator-v1') throw new Error('Preview branch does not match PR #40.');
          if (value.environment !== 'preview') throw new Error('Stripe QA target is not a Preview deployment.');
          if (value.mode !== 'test' || !value.testPaymentsAllowed) throw new Error('Stripe is not safely configured in test mode.');
          if (!value.configured || !value.webhookConfigured) throw new Error('Stripe, webhook, Supabase, or bypass configuration is incomplete.');
          console.log({
            commit: value.commitSha,
            branch: value.branch,
            environment: value.environment,
            stripeMode: value.mode,
            configured: value.configured,
            webhookConfigured: value.webhookConfigured,
          });
          NODE

      - name: Run canonical Stripe lifecycle QA
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error \
            --request POST \
            --output stripe-qa-result.json \
            --write-out "%{http_code}" \
            --header "content-type: application/json" \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --header "x-damasio-qa-secret: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --data "{\"commit\":\"$TARGET_COMMIT\"}" \
            "$BASE_URL/api/internal/preview-stripe-qa")

          if [ "$status" != "200" ]; then
            echo "Stripe QA request failed with HTTP $status."
            head -c 2000 stripe-qa-result.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('stripe-qa-result.json', 'utf8'));
          if (!result.passed) throw new Error(result.error || 'Stripe QA did not pass.');
          if (result.commit !== process.env.TARGET_COMMIT) throw new Error('Stripe QA response came from the wrong deployment.');
          if (result.stripeMode !== 'test') throw new Error('Stripe QA was not in test mode.');
          if (result.invoice?.status !== 'paid') throw new Error('QA invoice was not paid.');
          if (result.payment?.status !== 'paid') throw new Error('Canonical Payment was not paid.');
          if (!result.payout?.id || result.payout?.status !== 'pending_feedback') throw new Error('Canonical payout item was not created in the expected hold state.');
          if (!result.webhook?.received || result.webhook?.ledger?.status !== 'processed') throw new Error('Signed webhook was not fully processed.');
          if (result.wallet?.transactionType !== 'topup') throw new Error('Wallet top-up transaction was not created.');
          if (Number(result.wallet?.amountCredits || 0) !== 10) throw new Error('Wallet test top-up amount was not CAD 10.');
          if (Number(result.wallet?.balanceCredits || 0) < 10) throw new Error('Wallet balance was not credited.');
          if (result.wallet?.depositInvoice?.status !== 'paid') throw new Error('Wallet deposit invoice was not finalized.');

          const summary = {
            passed: true,
            commit: result.commit,
            stripeMode: result.stripeMode,
            invoiceStatus: result.invoice.status,
            paymentStatus: result.payment.status,
            payoutStatus: result.payout.status,
            webhookStatus: result.webhook.ledger.status,
            walletTransactionType: result.wallet.transactionType,
            walletTopUpCredits: result.wallet.amountCredits,
            walletDepositInvoiceStatus: result.wallet.depositInvoice.status,
          };
          fs.writeFileSync('stripe-qa-summary.json', JSON.stringify(summary, null, 2));
          console.log(summary);
          NODE

          rm -f stripe-qa-result.json

      - name: Upload sanitized Stripe QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-preview-stripe-qa
          path: stripe-qa-summary.json
          if-no-files-found: ignore
