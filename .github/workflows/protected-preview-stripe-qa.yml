name: Protected Preview Stripe QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/internal/preview-stripe-qa/**"
      - "app/api/stripe/**"
      - ".github/workflows/protected-preview-stripe-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-preview-stripe-qa
  cancel-in-progress: true

jobs:
  stripe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install protected-preview browser
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Authenticate to protected preview and run Stripe QA
        env:
          BASE_URL: https://damasio-os-h1mc-git-feature-25-30-homes-simulator-v1-damaio-os.vercel.app
          VERCEL_SHARE: 0md6VfURPNuJCbWgkNCvBcFoS4p5dGtf
          QA_TOKEN: preview-stripe-qa-20260729-4ever-seasons
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('@playwright/test');

          const baseUrl = process.env.BASE_URL;
          const share = process.env.VERCEL_SHARE;
          const qaToken = process.env.QA_TOKEN;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            page.setDefaultNavigationTimeout(120_000);

            await page.goto(`${baseUrl}/?_vercel_share=${share}`, { waitUntil: 'domcontentloaded' });
            await sleep(1500);

            let readiness = null;
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const response = await page.goto(
                `${baseUrl}/api/stripe/readiness?_vercel_share=${share}`,
                { waitUntil: 'domcontentloaded' },
              );
              const text = await page.locator('body').innerText().catch(() => '');
              try {
                readiness = JSON.parse(text);
              } catch {
                console.log(`Preview access attempt ${attempt}: HTTP ${response?.status()}; URL ${page.url()}`);
                await sleep(3000);
                continue;
              }
              if (readiness.commitSha && readiness.mode === 'test' && readiness.webhookConfigured) break;
              console.log(`Preview not ready: commit ${readiness.commitSha || 'unknown'}; Stripe ${readiness.mode || 'unknown'}`);
              readiness = null;
              await sleep(3000);
            }

            if (!readiness?.commitSha) throw new Error('Protected preview did not provide a deployed commit.');
            if (readiness.mode !== 'test' || !readiness.webhookConfigured) {
              throw new Error('Protected preview is not ready for safe Stripe test-mode QA.');
            }
            console.log(`Testing deployed preview commit ${readiness.commitSha} in Stripe test mode.`);

            const qaUrl = `${baseUrl}/api/internal/preview-stripe-qa?token=${encodeURIComponent(qaToken)}&commit=${readiness.commitSha}&_vercel_share=${share}`;
            const qaResponse = await page.goto(qaUrl, { waitUntil: 'domcontentloaded', timeout: 180_000 });
            const qaText = await page.locator('body').innerText();
            fs.writeFileSync('stripe-qa-result.json', qaText);

            let result;
            try {
              result = JSON.parse(qaText);
            } catch {
              throw new Error(`Stripe QA returned non-JSON HTTP ${qaResponse?.status()}: ${qaText.slice(0, 500)}`);
            }
            console.log(JSON.stringify(result, null, 2));

            if (!result.passed) throw new Error(result.error || 'Stripe QA did not pass.');
            if (result.stripeMode !== 'test') throw new Error('Stripe QA was not in test mode.');
            if (result.invoice?.status !== 'paid') throw new Error('QA invoice was not paid.');
            if (result.payment?.status !== 'paid') throw new Error('Canonical payment was not paid.');
            if (!result.webhook?.received) throw new Error('Signed webhook was not processed.');
            if (Number(result.wallet?.balanceCredits || 0) < 10) throw new Error('Wallet test credit was not added.');

            console.log('Protected preview Stripe QA passed.');
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload Stripe QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-preview-stripe-qa
          path: stripe-qa-result.json
          if-no-files-found: ignore
