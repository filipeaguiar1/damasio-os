name: Employee live timer fix

on:
  push:
    branches:
      - fix/final-qa-hardening-20260808

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-qa-hardening-20260808
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply employee live timer fixes
        run: python scripts/qa-employee-live-timer-fix.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Persist validated employee fixes
        shell: bash
        run: |
          git config user.name "Damasio QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/mobile/employee/page.tsx components/mobile/EmployeeRouteMap.tsx app/api/mobile/employee/route/route.ts tests/full-ecosystem-smart-route.spec.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Employee live timer fixes already applied."
            exit 0
          fi
          git commit -m "Fix employee live Visit timers and concurrent starts"
          git push origin HEAD:fix/final-qa-hardening-20260808
