name: Production-Like Stripe and Visual QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/production-like-qa.spec.ts"
      - ".github/workflows/production-like-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-like-qa-v1
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      VERCEL_ENV: preview

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify isolated QA configuration
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const required = [
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY",
            "SUPABASE_SERVICE_ROLE_KEY",
            "E2E_ADMIN_EMAIL",
            "E2E_ADMIN_PASSWORD",
          ];
          const missing = required.filter(key => !process.env[key]);
          if (missing.length) throw new Error(`Missing GitHub Actions secrets: ${missing.join(", ")}`);

          const stripeReady = Boolean(
            process.env.STRIPE_SECRET_KEY?.startsWith("sk_test_")
            && (process.env.STRIPE_WEBHOOK_SECRET || process.env.STRIPE_CONNECT_WEBHOOK_SECRET)
          );
          fs.appendFileSync(process.env.GITHUB_ENV, `RUN_STRIPE_QA=${stripeReady ? "true" : "false"}\n`);
          console.log(stripeReady
            ? "Stripe test-mode QA and visual QA are enabled."
            : "GitHub Stripe secrets are absent; running the complete visual and operational QA. Stripe is validated separately inside the protected Vercel preview.");
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install temporary Playwright package
        run: pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.55.0

      - name: TypeScript and production build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start isolated production server
        run: |
          pnpm start > /tmp/production-like-qa-server.log 2>&1 &
          echo $! > /tmp/production-like-qa-server.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/production-like-qa-server.log
          exit 1

      - name: Run production-like QA
        run: pnpm exec playwright test tests/production-like-qa.spec.ts --reporter=line --workers=1

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-like-qa
          path: |
            qa-admin-simulator.png
            qa-employee-route.png
            qa-stripe-invoice-success.png
            qa-customer-payments.png
            qa-customer-mobile.png
            test-results/**
            /tmp/production-like-qa-server.log
          if-no-files-found: ignore
