name: Apply Admin Smart Route Web

on:
  push:
    branches:
      - feature/25-30-homes-simulator-v1
    paths:
      - scripts/apply-admin-smart-route-web.py
      - .github/workflows/apply-admin-smart-route-web.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 0

      - name: Apply focused patch
        run: python scripts/apply-admin-smart-route-web.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical route and build
        run: pnpm check && pnpm build

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-admin-smart-route-web.py .github/workflows/apply-admin-smart-route-web.yml
          git add components/admin/RouteAdvisorPanel.tsx app/api/admin/route-advisor/route.ts scripts/validate-canonical-map-sync.mjs
          git commit -m "Add Smart Route to Route Advisor web"
          git push origin HEAD:feature/25-30-homes-simulator-v1

# Trigger the focused implementation run.
