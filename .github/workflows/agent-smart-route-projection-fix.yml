name: QA Smart Route projection fix

on:
  push:
    branches:
      - qa/full-ecosystem-e2e-20260807
    paths:
      - .github/workflows/agent-smart-route-projection-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-ecosystem-e2e-20260807
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Patch approved Smart Route writer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/mobile/employee/smart-route/route.ts')
          source = path.read_text()

          if 'async function projectCanonicalVisitOrder(' not in source:
            marker = 'export async function POST(request: NextRequest) {'
            if marker not in source:
              raise SystemExit('POST marker not found')
            helper = '''async function projectCanonicalVisitOrder(
            service: any,
            routeId: string,
            orderedVisitIds: string[],
          ) {
            const projected = await service.rpc("sync_canonical_route_stops_v2", {
              p_route_id: routeId,
              p_source: "employee_smart_route_projection",
            });
            if (!projected.error) return;

            const message = String(projected.error.message || "");
            if (!/permission denied|schema cache|could not find the function|does not exist/i.test(message)) {
              throw new Error(`Canonical Visit projection failed: ${message}`);
            }

            // Temporary compatibility for databases where the later one-way
            // projection migration has not rolled out yet. route_stops remains
            // authoritative; this approved writer only projects to Visits.
            const cleared = await service
              .from("visits")
              .update({ route_order: null })
              .eq("route_id", routeId)
              .neq("status", "cancelled");
            if (cleared.error) {
              throw new Error(`Canonical Visit projection reset failed: ${cleared.error.message}`);
            }

            for (let index = 0; index < orderedVisitIds.length; index += 1) {
              const written = await service
                .from("visits")
                .update({ route_order: index + 1 })
                .eq("route_id", routeId)
                .eq("id", orderedVisitIds[index]);
              if (written.error) {
                throw new Error(`Canonical Visit projection write failed: ${written.error.message}`);
              }
            }
          }

          '''
            source = source.replace(marker, helper + marker, 1)

          call = 'await projectCanonicalVisitOrder(service, body.routeId, requestedOrder);'
          if call not in source:
            marker = 'const verified = await verifyCanonicalRoutePersistence(service, {'
            index = source.find(marker)
            if index < 0:
              raise SystemExit('verification call marker not found')
            source = source[:index] + call + '\n\n  ' + source[index:]

          path.write_text(source)
          PY

      - name: Validate architecture and types
        run: |
          pnpm install --frozen-lockfile
          pnpm test:route-writers
          pnpm typecheck

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/agent-smart-route-projection-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/mobile/employee/smart-route/route.ts .github/workflows/agent-smart-route-projection-fix.yml
          git commit -m "Fix Smart Route Visit order projection"
          git pull --rebase origin qa/full-ecosystem-e2e-20260807
          git push origin HEAD:qa/full-ecosystem-e2e-20260807
