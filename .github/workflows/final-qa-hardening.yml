name: Final QA hardening

on:
  push:
    branches:
      - fix/final-qa-hardening-20260808

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-qa-hardening-20260808
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply final QA hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          route_path = Path('app/api/mobile/employee/smart-route/route.ts')
          route = route_path.read_text()
          helper_import = 'import { projectCanonicalVisitOrderCompatibility } from "@/lib/routes/projectCanonicalVisitOrderCompatibility";\n'
          if helper_import not in route:
              anchor = 'import { verifyCanonicalRoutePersistence } from "@/lib/routes/verifyCanonicalRoutePersistence";\n'
              if anchor not in route:
                  raise SystemExit('Smart Route import anchor not found')
              route = route.replace(anchor, anchor + helper_import, 1)

          pattern = re.compile(r'async function projectCanonicalVisitOrder\(\n  service: any,\n  routeId: string,\n\): Promise<\{ projected: boolean; reason\?: string \}> \{.*?\n\}\n\nexport async function POST', re.S)
          replacement = '''async function projectCanonicalVisitOrder(\n  service: any,\n  routeId: string,\n): Promise<{ projected: true }> {\n  await projectCanonicalVisitOrderCompatibility(service, routeId);\n  return { projected: true };\n}\n\nexport async function POST'''
          route, count = pattern.subn(replacement, route, count=1)
          if count != 1:
              if 'await projectCanonicalVisitOrderCompatibility(service, routeId);' not in route:
                  raise SystemExit('Smart Route projection function anchor not found')
          route_path.write_text(route)

          test_path = Path('tests/full-ecosystem-smart-route.spec.ts')
          test = test_path.read_text()
          old = 'expect(["applied", "pending_migration"]).toContain(applied.visitProjection);'
          if old in test:
              test = test.replace(old, 'expect(applied.visitProjection).toBe("applied");', 1)
          conditional = '''    if (applied.visitProjection === "applied") {\n      reversed.forEach((visitId, index) => expect(projected.get(visitId), `visit ${visitId} route_order`).toBe(index + 1));\n    }'''
          unconditional = '''    reversed.forEach((visitId, index) =>\n      expect(projected.get(visitId), `visit ${visitId} route_order`).toBe(index + 1));'''
          if conditional in test:
              test = test.replace(conditional, unconditional, 1)
          if 'expect(applied.visitProjection).toBe("applied");' not in test:
              raise SystemExit('Smart Route test was not hardened')
          test_path.write_text(test)

          for css_name in ['app/role-mobile-system.css', 'app/role-portal-alignment.css']:
              path = Path(css_name)
              text = path.read_text()
              text = text.replace('align-items:end;', 'align-items:flex-end;')
              text = text.replace('align-items: end;', 'align-items: flex-end;')
              path.write_text(text)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['next'] = '14.2.35'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

      - name: Refresh dependency lock
        run: pnpm install --lockfile-only
      - name: Install dependencies from refreshed lock
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Persist only validated changes
        shell: bash
        run: |
          git config user.name "Damasio QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/mobile/employee/smart-route/route.ts tests/full-ecosystem-smart-route.spec.ts app/role-mobile-system.css app/role-portal-alignment.css package.json pnpm-lock.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Final hardening already applied."
            exit 0
          fi
          git commit -m "Fix final QA hardening blockers"
          git push origin HEAD:fix/final-qa-hardening-20260808
