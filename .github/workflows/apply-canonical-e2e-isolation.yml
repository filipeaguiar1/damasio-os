name: Apply Canonical E2E Isolation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-canonical-e2e-isolation.py"
      - ".github/workflows/apply-canonical-e2e-isolation.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/25-30-homes-simulator-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/25-30-homes-simulator-v1
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply isolated simulator setup
        run: python scripts/apply-canonical-e2e-isolation.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production build
        run: pnpm build
      - name: Commit validated test change
        run: |
          git config user.name "Damasio OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/canonical-route-sync.spec.ts
          if git diff --cached --quiet; then
            echo "No test change to commit."
            exit 0
          fi
          git commit -m "test(routes): isolate canonical simulator setup"
          git push origin HEAD:feature/25-30-homes-simulator-v1
